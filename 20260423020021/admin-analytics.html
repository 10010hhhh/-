<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访问分析 | 张三设计工作室</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/hh/cloud-api.js?v=2026042304"></script>
    <script src="/hh/data-manager.js?v=2026042304"></script>
    <style>
        :root {
            --primary: #1a1a1a;
            --secondary: #666666;
            --accent: #c9a87c;
            --background: #fafafa;
            --surface: #ffffff;
            --muted: #e8e8e8;
            --error: #dc3545;
            --success: #28a745;
            --warning: #ffc107;
            --font-heading: 'Cormorant Garamond', serif;
            --font-body: 'Inter', sans-serif;
            --sidebar-width: 260px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background-color: var(--background);
            color: var(--primary);
            min-height: 100vh;
        }

        .sidebar {
            position: fixed;
            left: 0; top: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--surface);
            border-right: 1px solid var(--muted);
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .sidebar-header { padding: 24px; border-bottom: 1px solid var(--muted); }
        .sidebar-logo {
            font-family: var(--font-heading);
            font-size: 24px;
            font-weight: 600;
            color: var(--primary);
            letter-spacing: 2px;
            text-decoration: none;
            display: block;
        }
        .sidebar-subtitle { font-size: 12px; color: var(--secondary); margin-top: 4px; }
        .sidebar-nav { flex: 1; padding: 16px 0; overflow-y: auto; }
        .nav-section { margin-bottom: 24px; }
        .nav-section-title {
            padding: 8px 24px;
            font-size: 11px;
            font-weight: 600;
            color: var(--secondary);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            font-size: 14px;
            color: var(--secondary);
            text-decoration: none;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }
        .nav-item:hover { background: var(--background); color: var(--primary); }
        .nav-item.active { background: rgba(201, 168, 124, 0.1); color: var(--accent); border-left-color: var(--accent); }
        .sidebar-footer { padding: 16px 24px; border-top: 1px solid var(--muted); }
        .user-info { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .user-avatar {
            width: 40px; height: 40px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }
        .user-name { font-size: 14px; font-weight: 500; }
        .user-role { font-size: 12px; color: var(--secondary); }
        .logout-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 10px 16px;
            font-family: var(--font-body);
            font-size: 14px;
            background: none;
            border: 1px solid var(--muted);
            border-radius: 4px;
            color: var(--secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .logout-btn:hover { background: var(--error); border-color: var(--error); color: white; }

        .main-content { margin-left: var(--sidebar-width); min-height: 100vh; }
        .topbar {
            position: sticky;
            top: 0;
            background: var(--surface);
            border-bottom: 1px solid var(--muted);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 50;
        }
        .topbar-title { font-size: 20px; font-weight: 600; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 500;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--accent); }
        .btn-secondary { background: var(--muted); color: var(--primary); }
        .btn-secondary:hover { background: var(--secondary); color: white; }
        .btn-danger { background: var(--error); color: white; }

        .content { padding: 32px; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: var(--surface);
            padding: 24px;
            border-radius: 8px;
            border: 1px solid var(--muted);
        }
        .stat-icon {
            width: 48px; height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            color: white;
            margin-bottom: 16px;
        }
        .stat-icon.visits { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .stat-icon.visitors { background: linear-gradient(135deg, #667eea, #764ba2); }
        .stat-icon.pages { background: linear-gradient(135deg, #f093fb, #f5576c); }
        .stat-icon.duration { background: linear-gradient(135deg, #43e97b, #38f9d7); }
        .stat-value {
            font-family: var(--font-heading);
            font-size: 36px;
            font-weight: 600;
            color: var(--primary);
            line-height: 1;
            margin-bottom: 4px;
        }
        .stat-label { font-size: 14px; color: var(--secondary); }

        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            align-items: center;
        }
        .filter-select {
            padding: 10px 16px;
            font-family: var(--font-body);
            font-size: 14px;
            background: var(--surface);
            border: 1px solid var(--muted);
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }
        .filter-select:focus { border-color: var(--accent); }

        .card {
            background: var(--surface);
            border-radius: 8px;
            border: 1px solid var(--muted);
            margin-bottom: 24px;
        }
        .card-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--muted);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-body { padding: 24px; }

        .table {
            width: 100%;
            border-collapse: collapse;
        }
        .table th, .table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--muted);
            font-size: 14px;
        }
        .table th {
            font-weight: 600;
            color: var(--secondary);
            background: var(--background);
        }
        .table tr:hover { background: var(--background); }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: 500;
            border-radius: 4px;
        }
        .badge-success { background: rgba(40, 167, 69, 0.1); color: var(--success); }
        .badge-warning { background: rgba(255, 193, 7, 0.1); color: var(--warning); }

        .chart-placeholder {
            height: 200px;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 20px 0;
        }
        .chart-bar {
            flex: 1;
            background: var(--accent);
            border-radius: 4px 4px 0 0;
            min-height: 10px;
            position: relative;
            transition: all 0.3s ease;
        }
        .chart-bar:hover { background: var(--primary); }
        .chart-bar-label {
            position: absolute;
            bottom: -24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: var(--secondary);
            white-space: nowrap;
        }
        .chart-bar-value {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            font-weight: 500;
        }

        .location-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }
        .location-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: var(--background);
            border-radius: 8px;
        }
        .location-icon {
            width: 40px; height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(201, 168, 124, 0.1);
            color: var(--accent);
            border-radius: 50%;
        }
        .location-info { flex: 1; }
        .location-name { font-weight: 500; margin-bottom: 2px; }
        .location-count { font-size: 12px; color: var(--secondary); }

        .empty-state {
            text-align: center;
            padding: 48px;
            color: var(--secondary);
        }
        .empty-state i { margin-bottom: 16px; opacity: 0.5; }

        .toast {
            position: fixed;
            bottom: 24px; right: 24px;
            padding: 16px 24px;
            background: var(--primary);
            color: white;
            border-radius: 8px;
            font-size: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--error); }

        @media (max-width: 1200px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .main-content { margin-left: 0; }
            .content { padding: 16px; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="index.html" class="sidebar-logo">张三</a>
            <p class="sidebar-subtitle">设计工作室管理后台</p>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section">
                <div class="nav-section-title">概览</div>
                <a href="admin-dashboard.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i>
                    <span>仪表盘</span>
                </a>
                <a href="admin-analytics.html" class="nav-item active">
                    <i data-lucide="bar-chart-2"></i>
                    <span>访问分析</span>
                </a>
            </div>
            <div class="nav-section">
                <div class="nav-section-title">内容管理</div>
                <a href="admin-banner.html" class="nav-item">
                    <i data-lucide="layout-template"></i>
                    <span>Banner管理</span>
                </a>
                <a href="admin-works.html" class="nav-item">
                    <i data-lucide="image"></i>
                    <span>作品管理</span>
                </a>
                <a href="admin-about.html" class="nav-item">
                    <i data-lucide="user"></i>
                    <span>设计师简介</span>
                </a>
                <a href="admin-resume.html" class="nav-item">
                    <i data-lucide="file-text"></i>
                    <span>个人简历</span>
                </a>
                <a href="admin-contacts.html" class="nav-item">
                    <i data-lucide="mail"></i>
                    <span>联系数据</span>
                </a>
            </div>
            <div class="nav-section">
                <div class="nav-section-title">系统</div>
                <a href="admin-settings.html" class="nav-item">
                    <i data-lucide="settings"></i>
                    <span>设置</span>
                </a>
            </div>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">A</div>
                <div>
                    <div class="user-name" id="userName">Admin</div>
                    <div class="user-role">管理员</div>
                </div>
            </div>
            <button class="logout-btn" id="logoutBtn">
                <i data-lucide="log-out" width="18" height="18"></i>
                退出登录
            </button>
        </div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <h1 class="topbar-title">访问分析</h1>
            <div style="display: flex; gap: 12px;">
                <button class="btn btn-secondary" id="exportBtn">
                    <i data-lucide="download" width="18" height="18"></i>
                    导出报告
                </button>
                <button class="btn btn-danger" id="clearBtn">
                    <i data-lucide="trash-2" width="18" height="18"></i>
                    清空记录
                </button>
            </div>
        </header>

        <div class="content">
            <div class="filter-bar">
                <select class="filter-select" id="periodSelect">
                    <option value="7">最近 7 天</option>
                    <option value="14">最近 14 天</option>
                    <option value="30" selected>最近 30 天</option>
                    <option value="90">最近 90 天</option>
                </select>
            </div>

            <!-- 统计概览 -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon visits">
                        <i data-lucide="eye"></i>
                    </div>
                    <div class="stat-value" id="totalVisits">0</div>
                    <div class="stat-label">总访问量</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon visitors">
                        <i data-lucide="users"></i>
                    </div>
                    <div class="stat-value" id="uniqueVisitors">0</div>
                    <div class="stat-label">独立访客</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon pages">
                        <i data-lucide="file-text"></i>
                    </div>
                    <div class="stat-value" id="totalPages">0</div>
                    <div class="stat-label">页面浏览</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon duration">
                        <i data-lucide="clock"></i>
                    </div>
                    <div class="stat-value" id="avgDuration">0s</div>
                    <div class="stat-label">平均停留</div>
                </div>
            </div>

            <!-- 趋势图表 -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">
                        <i data-lucide="trending-up"></i>
                        访问趋势
                    </h2>
                </div>
                <div class="card-body">
                    <div class="chart-placeholder" id="trendChart"></div>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                <!-- 热门页面 -->
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">
                            <i data-lucide="file-text"></i>
                            热门页面
                        </h2>
                    </div>
                    <div class="card-body" style="padding: 0;">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>页面</th>
                                    <th>访问量</th>
                                    <th>独立访客</th>
                                    <th>平均时长</th>
                                </tr>
                            </thead>
                            <tbody id="topPagesTable">
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 地区分布 -->
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">
                            <i data-lucide="map-pin"></i>
                            地区分布
                        </h2>
                    </div>
                    <div class="card-body">
                        <div class="location-list" id="locationList"></div>
                    </div>
                </div>
            </div>

            <!-- 详细访问记录 -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">
                        <i data-lucide="list"></i>
                        最近访问记录
                    </h2>
                </div>
                <div class="card-body" style="padding: 0;">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>时间</th>
                                <th>页面</th>
                                <th>IP地址</th>
                                <th>地区</th>
                                <th>ISP</th>
                                <th>停留时长</th>
                            </tr>
                        </thead>
                        <tbody id="visitRecordsTable">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            lucide.createIcons();

            function checkAuth() {
                const session = JSON.parse(localStorage.getItem('portfolio_session') || sessionStorage.getItem('portfolio_session') || 'null');
                if (!session || !session.isLoggedIn) {
                    window.location.href = 'admin-login.html';
                }
                return session;
            }

            const session = checkAuth();
            if (session) {
                document.getElementById('userName').textContent = session.username;
                document.getElementById('userAvatar').textContent = session.username.charAt(0).toUpperCase();
            }

            document.getElementById('logoutBtn').addEventListener('click', () => {
                localStorage.removeItem('portfolio_session');
                sessionStorage.removeItem('portfolio_session');
                window.location.href = 'admin-login.html';
            });

            // 获取 IP 信息
            function initIPInfo() {
                WorksData.getIPInfo().then(info => {
                    console.log('[Analytics] IP Info:', info);
                });
            }

            // 格式化时长
            function formatDuration(seconds) {
                if (seconds < 60) return seconds + 's';
                if (seconds < 3600) return Math.floor(seconds / 60) + 'm ' + (seconds % 60) + 's';
                return Math.floor(seconds / 3600) + 'h ' + Math.floor((seconds % 3600) / 60) + 'm';
            }

            // 格式化时间
            function formatTime(isoString) {
                const date = new Date(isoString);
                return date.toLocaleString('zh-CN', {
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            }

            // 获取页面名称
            function getPageName(page) {
                const names = {
                    'admin-dashboard.html': '仪表盘',
                    'admin-works.html': '作品管理',
                    'admin-about.html': '设计师简介',
                    'admin-resume.html': '个人简历',
                    'admin-contacts.html': '联系数据',
                    'admin-settings.html': '系统设置',
                    'admin-banner.html': 'Banner管理',
                    'admin-analytics.html': '访问分析',
                    'index.html': '首页',
                    'work.html': '作品详情',
                    'resume.html': '简历页面'
                };
                return names[page] || page;
            }

            // 加载报告数据
            function loadReport() {
                const days = parseInt(document.getElementById('periodSelect').value);
                const report = WorksData.generateVisitReport(days);

                // 更新统计卡片
                document.getElementById('totalVisits').textContent = report.summary.totalVisits;
                document.getElementById('uniqueVisitors').textContent = report.summary.uniqueVisitors;
                document.getElementById('totalPages').textContent = report.summary.totalPageViews;
                document.getElementById('avgDuration').textContent = formatDuration(report.summary.avgDuration);

                // 渲染趋势图表
                renderTrendChart(report.dailyStats);

                // 渲染热门页面
                renderTopPages(report.topPages);

                // 渲染地区分布
                renderLocationStats(report.topLocations);

                // 渲染访问记录
                renderVisitRecords(report.recentVisits);
            }

            // 渲染趋势图表
            function renderTrendChart(dailyStats) {
                const container = document.getElementById('trendChart');
                if (!dailyStats || dailyStats.length === 0) {
                    container.innerHTML = '<div class="empty-state"><i data-lucide="bar-chart-2" width="48" height="48"></i><p>暂无数据</p></div>';
                    lucide.createIcons();
                    return;
                }

                const maxVisits = Math.max(...dailyStats.map(d => d.visits), 1);

                container.innerHTML = dailyStats.map(stat => {
                    const height = (stat.visits / maxVisits * 100).toFixed(1);
                    const date = new Date(stat.date);
                    const label = `${date.getMonth() + 1}/${date.getDate()}`;
                    return `
                        <div class="chart-bar" style="height: ${Math.max(height, 5)}%">
                            <span class="chart-bar-value">${stat.visits}</span>
                            <span class="chart-bar-label">${label}</span>
                        </div>
                    `;
                }).join('');
            }

            // 渲染热门页面
            function renderTopPages(topPages) {
                const tbody = document.getElementById('topPagesTable');
                if (!topPages || topPages.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 24px; color: var(--secondary);">暂无数据</td></tr>';
                    return;
                }

                tbody.innerHTML = topPages.map(page => `
                    <tr>
                        <td>${getPageName(page.page)}</td>
                        <td>${page.visits}</td>
                        <td>${page.uniqueVisitors}</td>
                        <td>${formatDuration(page.avgDuration)}</td>
                    </tr>
                `).join('');
            }

            // 渲染地区分布
            function renderLocationStats(topLocations) {
                const container = document.getElementById('locationList');
                if (!topLocations || topLocations.length === 0) {
                    container.innerHTML = '<div class="empty-state">暂无数据</div>';
                    return;
                }

                container.innerHTML = topLocations.map(loc => `
                    <div class="location-item">
                        <div class="location-icon">
                            <i data-lucide="map-pin" width="20" height="20"></i>
                        </div>
                        <div class="location-info">
                            <div class="location-name">${loc.location}</div>
                            <div class="location-count">${loc.region || ''} ${loc.city || ''} · ${loc.visits}次访问</div>
                        </div>
                    </div>
                `).join('');
                lucide.createIcons();
            }

            // 渲染访问记录
            function renderVisitRecords(recentVisits) {
                const tbody = document.getElementById('visitRecordsTable');
                if (!recentVisits || recentVisits.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 24px; color: var(--secondary);">暂无访问记录</td></tr>';
                    return;
                }

                tbody.innerHTML = recentVisits.map(visit => `
                    <tr>
                        <td>${formatTime(visit.visitTime)}</td>
                        <td>${getPageName(visit.page)}</td>
                        <td><code style="font-size: 12px;">${visit.ip}</code></td>
                        <td>${visit.location.region || ''} ${visit.location.city || ''} ${visit.location.district || ''}</td>
                        <td>${visit.isp || '未知'}</td>
                        <td>-</td>
                    </tr>
                `).join('');
            }

            // Toast 提示
            function showToast(message, type = 'info') {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.className = `toast ${type}`;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3000);
            }

            // 导出报告
            document.getElementById('exportBtn').addEventListener('click', () => {
                try {
                    const days = parseInt(document.getElementById('periodSelect').value);
                    WorksData.exportVisitReport(days);
                    showToast('报告已导出', 'success');
                } catch (err) {
                    showToast('导出失败: ' + err.message, 'error');
                }
            });

            // 清空记录
            document.getElementById('clearBtn').addEventListener('click', () => {
                if (confirm('确定要清空所有访问记录吗？此操作不可恢复！')) {
                    WorksData.clearVisitLogs();
                    loadReport();
                    showToast('访问记录已清空', 'success');
                }
            });

            // 时间选择
            document.getElementById('periodSelect').addEventListener('change', loadReport);

            // 初始化
            initIPInfo();
            loadReport();
        });
    </script>
</body>
</html>
