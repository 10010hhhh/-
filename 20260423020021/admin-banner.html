<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner管理 | 张三设计工作室</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/hh/cloud-api.js?v=2026042304"></script>
    <script src="/hh/data-manager.js?v=2026042304"></script>
    <style>
        :root {
            --primary: #1a1a1a;
            --secondary: #666666;
            --accent: #c9a87c;
            --background: #fafafa;
            --surface: #ffffff;
            --muted: #e8e8e8;
            --error: #dc3545;
            --success: #28a745;
            --warning: #ffc107;
            --font-heading: 'Cormorant Garamond', serif;
            --font-body: 'Inter', sans-serif;
            --sidebar-width: 260px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background-color: var(--background);
            color: var(--primary);
            min-height: 100vh;
        }

        .sidebar {
            position: fixed;
            left: 0; top: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--surface);
            border-right: 1px solid var(--muted);
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .sidebar-header { padding: 24px; border-bottom: 1px solid var(--muted); }
        .sidebar-logo {
            font-family: var(--font-heading);
            font-size: 24px;
            font-weight: 600;
            color: var(--primary);
            letter-spacing: 2px;
            text-decoration: none;
            display: block;
        }
        .sidebar-subtitle { font-size: 12px; color: var(--secondary); margin-top: 4px; }
        .sidebar-nav { flex: 1; padding: 16px 0; overflow-y: auto; }
        .nav-section { margin-bottom: 24px; }
        .nav-section-title {
            padding: 8px 24px;
            font-size: 11px;
            font-weight: 600;
            color: var(--secondary);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            font-size: 14px;
            color: var(--secondary);
            text-decoration: none;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }
        .nav-item:hover { background: var(--background); color: var(--primary); }
        .nav-item.active { background: rgba(201, 168, 124, 0.1); color: var(--accent); border-left-color: var(--accent); }
        .sidebar-footer { padding: 16px 24px; border-top: 1px solid var(--muted); }
        .user-info { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .user-avatar {
            width: 40px; height: 40px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }
        .user-name { font-size: 14px; font-weight: 500; }
        .user-role { font-size: 12px; color: var(--secondary); }
        .logout-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 10px 16px;
            font-family: var(--font-body);
            font-size: 14px;
            background: none;
            border: 1px solid var(--muted);
            border-radius: 4px;
            color: var(--secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .logout-btn:hover { background: var(--error); border-color: var(--error); color: white; }

        .main-content { margin-left: var(--sidebar-width); min-height: 100vh; }
        .topbar {
            position: sticky;
            top: 0;
            background: var(--surface);
            border-bottom: 1px solid var(--muted);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 50;
        }
        .topbar-title { font-size: 20px; font-weight: 600; }
        .topbar-actions { display: flex; align-items: center; gap: 16px; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 500;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--accent); }
        .btn-outline { background: none; border: 1px solid var(--muted); color: var(--secondary); }
        .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
        .btn-danger { background: var(--error); color: white; }
        .btn-danger:hover { background: #c82333; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .content { padding: 32px; }

        .banners-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        .banner-card {
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid var(--muted);
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .banner-card:hover {
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }
        .banner-card.inactive {
            opacity: 0.6;
        }
        .banner-image {
            position: relative;
            aspect-ratio: 16/9;
            overflow: hidden;
        }
        .banner-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .banner-status {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 12px;
        }
        .banner-status.active {
            background: var(--success);
            color: white;
        }
        .banner-status.inactive {
            background: var(--secondary);
            color: white;
        }
        .banner-order {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 28px;
            height: 28px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
        }
        .banner-body { padding: 20px; }
        .banner-title {
            font-family: var(--font-heading);
            font-size: 20px;
            margin-bottom: 4px;
        }
        .banner-subtitle {
            font-size: 14px;
            color: var(--secondary);
            margin-bottom: 16px;
        }
        .banner-actions {
            display: flex;
            gap: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 80px 40px;
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid var(--muted);
        }
        .empty-state-icon { width: 80px; height: 80px; margin: 0 auto 24px; color: var(--muted); }
        .empty-state-title { font-family: var(--font-heading); font-size: 24px; margin-bottom: 8px; }
        .empty-state-desc { font-size: 14px; color: var(--secondary); margin-bottom: 24px; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal {
            background: var(--surface);
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow: hidden;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal { transform: translateY(0); }
        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--muted);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-title { font-size: 18px; font-weight: 600; }
        .modal-close {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .modal-close:hover { background: var(--muted); }
        .modal-body { padding: 24px; max-height: 60vh; overflow-y: auto; }
        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--muted);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .form-group { margin-bottom: 20px; }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--primary);
            margin-bottom: 8px;
        }
        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 12px 16px;
            font-family: var(--font-body);
            font-size: 14px;
            background: var(--background);
            border: 1px solid var(--muted);
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s ease;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
        .form-textarea { resize: vertical; min-height: 80px; }

        .image-upload-area {
            border: 2px dashed var(--muted);
            border-radius: 8px;
            padding: 32px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .image-upload-area:hover {
            border-color: var(--accent);
            background: rgba(201, 168, 124, 0.05);
        }
        .image-upload-area.dragover { border-color: var(--accent); background: rgba(201, 168, 124, 0.1); }
        .image-preview {
            margin-top: 16px;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        .image-preview img {
            width: 100%;
            height: auto;
            display: block;
        }
        .image-preview-remove {
            position: absolute;
            top: 8px; right: 8px;
            width: 32px; height: 32px;
            border-radius: 50%;
            background: var(--error);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .delete-confirm { text-align: center; padding: 20px; }
        .delete-confirm-icon { width: 64px; height: 64px; margin: 0 auto 20px; color: var(--error); }

        .toast {
            position: fixed;
            bottom: 24px; right: 24px;
            padding: 16px 24px;
            background: var(--primary);
            color: white;
            border-radius: 8px;
            font-size: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--error); }

        .preview-hint {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: rgba(201, 168, 124, 0.1);
            border-radius: 8px;
            font-size: 13px;
            color: var(--accent);
            margin-bottom: 20px;
        }

        @media (max-width: 1024px) { .banners-grid { grid-template-columns: 1fr; } }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .main-content { margin-left: 0; }
            .content { padding: 16px; }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="index.html" class="sidebar-logo">张三</a>
            <p class="sidebar-subtitle">设计工作室管理后台</p>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section">
                <div class="nav-section-title">概览</div>
                <a href="admin-dashboard.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i>
                    <span>仪表盘</span>
                </a>
                <a href="admin-analytics.html" class="nav-item">
                    <i data-lucide="bar-chart-2"></i>
                    <span>访问分析</span>
                </a>
            </div>
            <div class="nav-section">
                <div class="nav-section-title">内容管理</div>
                <a href="admin-banner.html" class="nav-item active">
                    <i data-lucide="layout-template"></i>
                    <span>Banner管理</span>
                </a>
                <a href="admin-works.html" class="nav-item">
                    <i data-lucide="image"></i>
                    <span>作品管理</span>
                </a>
                <a href="admin-about.html" class="nav-item">
                    <i data-lucide="user"></i>
                    <span>设计师简介</span>
                </a>
                <a href="admin-resume.html" class="nav-item">
                    <i data-lucide="file-text"></i>
                    <span>个人简历</span>
                    <span class="nav-badge" id="resumeAuditBadge">0</span>
                </a>
                <a href="admin-contacts.html" class="nav-item">
                    <i data-lucide="mail"></i>
                    <span>联系数据</span>
                </a>
            </div>
            <div class="nav-section">
                <div class="nav-section-title">系统</div>
                <a href="admin-settings.html" class="nav-item">
                    <i data-lucide="settings"></i>
                    <span>设置</span>
                </a>
            </div>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">A</div>
                <div>
                    <div class="user-name" id="userName">Admin</div>
                    <div class="user-role">管理员</div>
                </div>
            </div>
            <button class="logout-btn" id="logoutBtn">
                <i data-lucide="log-out" width="18" height="18"></i>
                退出登录
            </button>
        </div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <h1 class="topbar-title">Banner管理</h1>
            <div class="topbar-actions">
                <button class="btn btn-primary" id="addBannerBtn">
                    <i data-lucide="plus" width="18" height="18"></i>
                    添加Banner
                </button>
            </div>
        </header>

        <div class="content">
            <div class="preview-hint">
                <i data-lucide="info" width="16" height="16"></i>
                <span>首页轮播Banner将按顺序展示，建议尺寸 1920×1080，支持最多5张Banner</span>
            </div>

            <div class="banners-grid" id="bannersGrid"></div>

            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-state-icon">
                    <i data-lucide="layout-template" width="80" height="80"></i>
                </div>
                <h3 class="empty-state-title">暂无Banner</h3>
                <p class="empty-state-desc">点击上方按钮添加首页轮播Banner</p>
                <button class="btn btn-primary" id="emptyAddBtn">
                    <i data-lucide="plus" width="18" height="18"></i>
                    添加Banner
                </button>
            </div>
        </div>
    </main>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="bannerModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">添加Banner</h2>
                <button class="modal-close" id="modalClose">
                    <i data-lucide="x" width="20" height="20"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="bannerForm">
                    <input type="hidden" id="bannerId">
                    <div class="form-group">
                        <label class="form-label">Banner标题 *</label>
                        <input type="text" class="form-input" id="bannerTitle" required placeholder="输入Banner标题">
                    </div>
                    <div class="form-group">
                        <label class="form-label">副标题</label>
                        <input type="text" class="form-input" id="bannerSubtitle" placeholder="输入副标题/描述">
                    </div>
                    <div class="form-group">
                        <label class="form-label">跳转链接</label>
                        <input type="text" class="form-input" id="bannerLink" placeholder="可选，填写后点击Banner将跳转">
                    </div>
                    <div class="form-group">
                        <label class="form-label">背景图片 *</label>
                        <div class="image-upload-area" id="imageUploadArea">
                            <div style="color: var(--secondary); margin-bottom: 8px;">
                                <i data-lucide="upload-cloud" width="40" height="40"></i>
                            </div>
                            <p style="font-size: 14px; color: var(--secondary); margin-bottom: 4px;">点击或拖拽上传图片</p>
                            <p style="font-size: 12px; color: #aaa;">建议尺寸 1920×1080</p>
                            <input type="file" id="imageInput" accept="image/*" style="display: none;">
                        </div>
                        <div class="image-preview" id="imagePreview" style="display: none;"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">状态</label>
                        <select class="form-select" id="bannerStatus">
                            <option value="active">启用</option>
                            <option value="inactive">禁用</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" id="cancelBtn">取消</button>
                <button type="button" class="btn btn-primary" id="saveBtn">保存</button>
            </div>
        </div>
    </div>

    <!-- Delete Modal -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal" style="max-width: 400px;">
            <div class="modal-header">
                <h2 class="modal-title">确认删除</h2>
                <button class="modal-close" id="deleteModalClose">
                    <i data-lucide="x" width="20" height="20"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="delete-confirm">
                    <div class="delete-confirm-icon">
                        <i data-lucide="alert-triangle" width="64" height="64"></i>
                    </div>
                    <p style="font-size: 16px; margin-bottom: 8px;">确定要删除此Banner吗？</p>
                    <p style="font-size: 14px; color: var(--secondary);">此操作不可恢复</p>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" id="cancelDeleteBtn">取消</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">确认删除</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        lucide.createIcons();

        function checkAuth() {
            const session = JSON.parse(localStorage.getItem('portfolio_session') || sessionStorage.getItem('portfolio_session') || 'null');
            if (!session || !session.isLoggedIn) window.location.href = 'admin-login.html';
            return session;
        }

        const session = checkAuth();
        if (session) {
            document.getElementById('userName').textContent = session.username;
            document.getElementById('userAvatar').textContent = session.username.charAt(0).toUpperCase();
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('portfolio_session');
            sessionStorage.removeItem('portfolio_session');
            window.location.href = 'admin-login.html';
        });

        let currentBanners = WorksData.getBanners();
        let editingBannerId = null, deleteBannerId = null;
        let bannerImageData = null;

        const bannersGrid = document.getElementById('bannersGrid');
        const emptyState = document.getElementById('emptyState');
        const bannerModal = document.getElementById('bannerModal');
        const deleteModal = document.getElementById('deleteModal');

        function renderBanners() {
            if (currentBanners.length === 0) {
                bannersGrid.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }
            emptyState.style.display = 'none';

            bannersGrid.innerHTML = currentBanners.map((banner, index) => `
                <div class="banner-card ${banner.status !== 'active' ? 'inactive' : ''}" data-id="${banner.id}">
                    <div class="banner-image">
                        <img src="${banner.image}" alt="${banner.title}">
                        <span class="banner-status ${banner.status}">${banner.status === 'active' ? '启用' : '禁用'}</span>
                        <span class="banner-order">${index + 1}</span>
                    </div>
                    <div class="banner-body">
                        <h3 class="banner-title">${banner.title}</h3>
                        <p class="banner-subtitle">${banner.subtitle || '无副标题'}</p>
                        <div class="banner-actions">
                            <button class="btn btn-outline btn-sm edit-btn" data-id="${banner.id}">
                                <i data-lucide="edit-2" width="14" height="14"></i> 编辑
                            </button>
                            <button class="btn btn-outline btn-sm toggle-btn" data-id="${banner.id}">
                                <i data-lucide="${banner.status === 'active' ? 'eye-off' : 'eye'}" width="14" height="14"></i>
                                ${banner.status === 'active' ? '禁用' : '启用'}
                            </button>
                            <button class="btn btn-outline btn-sm delete-btn" data-id="${banner.id}">
                                <i data-lucide="trash-2" width="14" height="14"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function openBannerModal(banner = null) {
            editingBannerId = banner ? banner.id : null;
            bannerImageData = null;
            document.getElementById('modalTitle').textContent = banner ? '编辑Banner' : '添加Banner';
            document.getElementById('bannerForm').reset();
            document.getElementById('imagePreview').style.display = 'none';

            if (banner) {
                document.getElementById('bannerId').value = banner.id;
                document.getElementById('bannerTitle').value = banner.title;
                document.getElementById('bannerSubtitle').value = banner.subtitle || '';
                document.getElementById('bannerLink').value = banner.link || '';
                document.getElementById('bannerStatus').value = banner.status;
                if (banner.image) {
                    bannerImageData = banner.image;
                    document.getElementById('imagePreview').innerHTML = `<img src="${banner.image}" alt="预览"><button type="button" class="image-preview-remove" onclick="removeImage()"><i data-lucide="x" width="16" height="16"></i></button>`;
                    document.getElementById('imagePreview').style.display = 'block';
                }
            }
            bannerModal.classList.add('active');
        }

        function closeBannerModal() {
            bannerModal.classList.remove('active');
            editingBannerId = null;
        }

        function openDeleteModal(bannerId) {
            deleteBannerId = bannerId;
            deleteModal.classList.add('active');
        }

        function closeDeleteModal() {
            deleteModal.classList.remove('active');
            deleteBannerId = null;
        }

        function saveBanner() {
            const title = document.getElementById('bannerTitle').value.trim();
            if (!title) { showToast('请填写标题', 'error'); return; }
            if (!bannerImageData) { showToast('请上传背景图片', 'error'); return; }

            const bannerData = {
                title,
                subtitle: document.getElementById('bannerSubtitle').value.trim(),
                link: document.getElementById('bannerLink').value.trim(),
                image: bannerImageData,
                status: document.getElementById('bannerStatus').value
            };

            if (editingBannerId) {
                WorksData.updateBanner(editingBannerId, bannerData);
                WorksData.addLog('banner_edit', `编辑Banner: ${bannerData.title}`);
                showToast('Banner已更新', 'success');
            } else {
                WorksData.addBanner(bannerData);
                WorksData.addLog('banner_add', `新增Banner: ${bannerData.title}`);
                showToast('Banner已添加', 'success');
            }

            currentBanners = WorksData.getBanners();
            renderBanners();
            closeBannerModal();
        }

        function removeImage() {
            bannerImageData = null;
            document.getElementById('imagePreview').style.display = 'none';
        }

        function setupImageUpload() {
            const area = document.getElementById('imageUploadArea');
            const input = document.getElementById('imageInput');
            area.addEventListener('click', () => input.click());
            area.addEventListener('dragover', (e) => { e.preventDefault(); area.classList.add('dragover'); });
            area.addEventListener('dragleave', () => area.classList.remove('dragover'));
            area.addEventListener('drop', (e) => {
                e.preventDefault();
                area.classList.remove('dragover');
                handleFile(e.dataTransfer.files[0]);
            });
            input.addEventListener('change', () => { handleFile(input.files[0]); input.value = ''; });
        }

        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                bannerImageData = e.target.result;
                document.getElementById('imagePreview').innerHTML = `<img src="${bannerImageData}" alt="预览"><button type="button" class="image-preview-remove" onclick="removeImage()"><i data-lucide="x" width="16" height="16"></i></button>`;
                document.getElementById('imagePreview').style.display = 'block';
                lucide.createIcons();
            };
            reader.readAsDataURL(file);
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
        
        // 更新待审核简历数量
        function updateResumeBadge() {
            const pendingResumeChanges = WorksData.getPendingResumeChanges ? WorksData.getPendingResumeChanges() : [];
            const resumeBadge = document.getElementById('resumeAuditBadge');
            if (resumeBadge) {
                resumeBadge.textContent = pendingResumeChanges.length;
                resumeBadge.style.display = pendingResumeChanges.length > 0 ? 'inline-block' : 'none';
            }
        }
        
        // 页面加载时更新徽章
        updateResumeBadge();

        // Event Listeners
        document.getElementById('addBannerBtn').addEventListener('click', () => openBannerModal());
        document.getElementById('emptyAddBtn')?.addEventListener('click', () => openBannerModal());
        document.getElementById('modalClose').addEventListener('click', closeBannerModal);
        document.getElementById('cancelBtn').addEventListener('click', closeBannerModal);
        document.getElementById('saveBtn').addEventListener('click', saveBanner);
        document.getElementById('deleteModalClose').addEventListener('click', closeDeleteModal);
        document.getElementById('cancelDeleteBtn').addEventListener('click', closeDeleteModal);
        document.getElementById('confirmDeleteBtn').addEventListener('click', () => {
            if (deleteBannerId) {
                const banner = currentBanners.find(b => b.id === deleteBannerId);
                WorksData.deleteBanner(deleteBannerId);
                WorksData.addLog('banner_delete', `删除Banner: ${banner.title}`);
                currentBanners = WorksData.getBanners();
                renderBanners();
                closeDeleteModal();
                showToast('Banner已删除', 'success');
            }
        });

        bannersGrid.addEventListener('click', (e) => {
            const editBtn = e.target.closest('.edit-btn');
            const deleteBtn = e.target.closest('.delete-btn');
            const toggleBtn = e.target.closest('.toggle-btn');

            if (editBtn) {
                const id = parseInt(editBtn.dataset.id);
                openBannerModal(currentBanners.find(b => b.id === id));
            }
            if (deleteBtn) {
                const id = parseInt(deleteBtn.dataset.id);
                openDeleteModal(id);
            }
            if (toggleBtn) {
                const id = parseInt(toggleBtn.dataset.id);
                const banner = currentBanners.find(b => b.id === id);
                const newStatus = banner.status === 'active' ? 'inactive' : 'active';
                WorksData.updateBanner(id, { status: newStatus });
                WorksData.addLog('banner_toggle', `${newStatus === 'active' ? '启用' : '禁用'}Banner: ${banner.title}`);
                currentBanners = WorksData.getBanners();
                renderBanners();
                showToast(`Banner已${newStatus === 'active' ? '启用' : '禁用'}`, 'success');
            }
        });

        setupImageUpload();
        renderBanners();

        // ========== 用户访问追踪 ==========
        (function() {
            const currentPage = 'admin-banner.html';
            const userId = session?.username || 'admin';

            WorksData.startPageView(currentPage, userId);
            WorksData.recordVisit(currentPage, userId);

            let maxScroll = 0;
            window.addEventListener('scroll', function() {
                const scrollPercent = Math.round((window.scrollY / (document.body.scrollHeight - window.innerHeight)) * 100);
                if (scrollPercent > maxScroll) {
                    maxScroll = scrollPercent;
                    WorksData.updateScrollDepth(maxScroll);
                }
            });

            document.addEventListener('click', function() {
                WorksData.incrementInteractions();
            });

            window.addEventListener('beforeunload', function() {
                WorksData.endPageView();
            });

            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    WorksData.endPageView();
                } else {
                    WorksData.startPageView(currentPage, userId);
                }
            });
        })();
    </script>
</body>
</html>
