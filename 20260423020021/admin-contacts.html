<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系数据 | 张三设计工作室</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #1a1a1a;
            --secondary: #666666;
            --accent: #c9a87c;
            --background: #fafafa;
            --surface: #ffffff;
            --muted: #e8e8e8;
            --error: #dc3545;
            --success: #28a745;
            --warning: #ffc107;
            --font-heading: 'Cormorant Garamond', serif;
            --font-body: 'Inter', sans-serif;
            --sidebar-width: 260px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background-color: var(--background);
            color: var(--primary);
            min-height: 100vh;
        }

        .sidebar {
            position: fixed;
            left: 0; top: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--surface);
            border-right: 1px solid var(--muted);
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .sidebar-header { padding: 24px; border-bottom: 1px solid var(--muted); }
        .sidebar-logo {
            font-family: var(--font-heading);
            font-size: 24px;
            font-weight: 600;
            color: var(--primary);
            letter-spacing: 2px;
            text-decoration: none;
            display: block;
        }
        .sidebar-subtitle { font-size: 12px; color: var(--secondary); margin-top: 4px; }
        .sidebar-nav { flex: 1; padding: 16px 0; overflow-y: auto; }
        .nav-section { margin-bottom: 24px; }
        .nav-section-title {
            padding: 8px 24px;
            font-size: 11px;
            font-weight: 600;
            color: var(--secondary);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            font-size: 14px;
            color: var(--secondary);
            text-decoration: none;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }
        .nav-item:hover { background: var(--background); color: var(--primary); }
        .nav-item.active { background: rgba(201, 168, 124, 0.1); color: var(--accent); border-left-color: var(--accent); }
        .nav-badge {
            margin-left: auto;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 600;
            background: var(--error);
            color: white;
            border-radius: 10px;
        }
        .sidebar-footer { padding: 16px 24px; border-top: 1px solid var(--muted); }
        .user-info { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .user-avatar {
            width: 40px; height: 40px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }
        .user-name { font-size: 14px; font-weight: 500; }
        .user-role { font-size: 12px; color: var(--secondary); }
        .logout-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 10px 16px;
            font-family: var(--font-body);
            font-size: 14px;
            background: none;
            border: 1px solid var(--muted);
            border-radius: 4px;
            color: var(--secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .logout-btn:hover { background: var(--error); border-color: var(--error); color: white; }

        .main-content { margin-left: var(--sidebar-width); min-height: 100vh; }
        .topbar {
            position: sticky;
            top: 0;
            background: var(--surface);
            border-bottom: 1px solid var(--muted);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 50;
        }
        .topbar-title { font-size: 20px; font-weight: 600; }
        .topbar-actions { display: flex; align-items: center; gap: 12px; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 500;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--accent); }
        .btn-outline { background: none; border: 1px solid var(--muted); color: var(--secondary); }
        .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #218838; }
        .btn-danger { background: var(--error); color: white; }
        .btn-danger:hover { background: #c82333; }

        .content { padding: 32px; }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--muted);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
        .stat-value { font-family: var(--font-heading); font-size: 32px; font-weight: 600; color: var(--primary); }
        .stat-label { font-size: 13px; color: var(--secondary); margin-top: 4px; }
        .stat-card.highlight { border-color: var(--accent); }
        .stat-card.highlight .stat-value { color: var(--accent); }

        .filter-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: var(--surface);
            border: 1px solid var(--muted);
            border-radius: 4px;
            flex: 1;
            max-width: 400px;
        }
        .search-box input {
            flex: 1;
            border: none;
            background: none;
            font-family: var(--font-body);
            font-size: 14px;
            outline: none;
        }
        .filter-select {
            padding: 10px 16px;
            font-family: var(--font-body);
            font-size: 14px;
            background: var(--surface);
            border: 1px solid var(--muted);
            border-radius: 4px;
            cursor: pointer;
            outline: none;
        }

        .contacts-table {
            background: var(--surface);
            border: 1px solid var(--muted);
            border-radius: 8px;
            overflow: hidden;
        }

        .table-header {
            display: grid;
            grid-template-columns: 2fr 2fr 3fr 1fr 1fr;
            padding: 16px 24px;
            background: var(--background);
            font-size: 12px;
            font-weight: 600;
            color: var(--secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .contact-row {
            display: grid;
            grid-template-columns: 2fr 2fr 3fr 1fr 1fr;
            padding: 20px 24px;
            border-bottom: 1px solid var(--muted);
            align-items: center;
            transition: background 0.2s ease;
        }
        .contact-row:hover { background: var(--background); }
        .contact-row:last-child { border-bottom: none; }

        .contact-name { font-weight: 500; }
        .contact-email { color: var(--secondary); }
        .contact-message {
            font-size: 14px;
            color: var(--secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 300px;
        }
        .contact-date { font-size: 13px; color: var(--secondary); }
        .contact-status {
            display: inline-flex;
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 500;
            border-radius: 12px;
        }
        .status-new { background: rgba(220, 53, 69, 0.1); color: var(--error); }
        .status-read { background: rgba(40, 167, 69, 0.1); color: var(--success); }
        .status-replied { background: rgba(201, 168, 124, 0.1); color: var(--accent); }

        .contact-actions { display: flex; gap: 8px; }
        .action-btn {
            width: 32px; height: 32px;
            border-radius: 4px;
            border: 1px solid var(--muted);
            background: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .action-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
        .action-btn.delete:hover { background: var(--error); border-color: var(--error); }
        .action-btn.reply:hover { background: var(--success); border-color: var(--success); }

        .empty-state {
            text-align: center;
            padding: 80px 40px;
        }
        .empty-state-icon { width: 64px; height: 64px; margin: 0 auto 20px; color: var(--muted); }
        .empty-state-title { font-size: 18px; margin-bottom: 8px; }
        .empty-state-desc { font-size: 14px; color: var(--secondary); }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 20px;
            border-top: 1px solid var(--muted);
        }
        .page-btn {
            width: 36px; height: 36px;
            border: 1px solid var(--muted);
            border-radius: 4px;
            background: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .page-btn:hover { background: var(--background); }
        .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal {
            background: var(--surface);
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            overflow: hidden;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal { transform: translateY(0); }
        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--muted);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-title { font-size: 18px; font-weight: 600; }
        .modal-close {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .modal-close:hover { background: var(--muted); }
        .modal-body { padding: 24px; }
        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--muted);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .detail-group { margin-bottom: 16px; }
        .detail-label { font-size: 12px; font-weight: 500; color: var(--secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .detail-value { font-size: 14px; }
        .detail-message {
            background: var(--background);
            padding: 16px;
            border-radius: 4px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .toast {
            position: fixed;
            bottom: 24px; right: 24px;
            padding: 16px 24px;
            background: var(--primary);
            color: white;
            border-radius: 8px;
            font-size: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--error); }

        @media (max-width: 1200px) {
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .table-header, .contact-row { grid-template-columns: 2fr 2fr 1fr 1fr; }
            .contact-message { display: none; }
        }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; }
            .stats-row { grid-template-columns: 1fr; }
            .table-header { display: none; }
            .contact-row { 
                display: flex; 
                flex-direction: column; 
                align-items: flex-start;
                gap: 8px;
            }
            .content { padding: 16px; }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="index.html" class="sidebar-logo">张三</a>
            <p class="sidebar-subtitle">设计工作室管理后台</p>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section">
                <div class="nav-section-title">概览</div>
                <a href="admin-dashboard.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i>
                    <span>仪表盘</span>
                </a>
                <a href="admin-analytics.html" class="nav-item">
                    <i data-lucide="bar-chart-2"></i>

                </a>
            </div>
            <div class="nav-section">
                <div class="nav-section-title">内容管理</div>
                <a href="admin-works.html" class="nav-item">

                    <span>作品管理</span>
                    <span class="nav-badge" id="worksBadge">0</span>
                </a>
                <a href="admin-contacts.html" class="nav-item active">
                    <i data-lucide="mail"></i>
                    <span>联系数据</span>
                    <span class="nav-badge" id="contactsBadge">0</span>
                </a>
                <a href="admin-resume.html" class="nav-item">
                    <i data-lucide="file-text"></i>
                    <span>个人简历</span>
                    <span class="nav-badge" id="resumeAuditBadge">0</span>
                </a>
            </div>
            <div class="nav-section">
                <div class="nav-section-title">系统</div>
                <a href="admin-settings.html" class="nav-item">
                    <i data-lucide="settings"></i>
                    <span>设置</span>
                </a>
            </div>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">A</div>

                    <div class="user-name" id="userName">Admin</div>
                    <div class="user-role">管理员</div>
                </div>
            </div>
            <button class="logout-btn" id="logoutBtn">
                <i data-lucide="log-out" width="18" height="18"></i>
                退出登录
            </button>
        </div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <h1 class="topbar-title">联系数据</h1>
            <div class="topbar-actions">
                <button class="btn btn-outline" id="exportBtn">
                    <i data-lucide="download" width="18" height="18"></i>
                    导出CSV
                </button>
                <button class="btn btn-outline" id="exportJsonBtn">
                    <i data-lucide="file-json" width="18" height="18"></i>
                    导出JSON
                </button>
                <button class="btn btn-danger" id="clearAllBtn">
                    <i data-lucide="trash-2" width="18" height="18"></i>
                    清空全部
                </button>
            </div>
        </header>

        <div class="content">
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-value" id="statTotal">0</div>
                    <div class="stat-label">总记录数</div>
                </div>
                <div class="stat-card highlight">
                    <div class="stat-value" id="statNew">0</div>
                    <div class="stat-label">待处理</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statRead">0</div>
                    <div class="stat-label">已查看</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statToday">0</div>
                    <div class="stat-label">今日新增</div>
                </div>
            </div>

            <div class="filter-bar">
                <div class="search-box">
                    <i data-lucide="search" width="18" height="18"></i>
                    <input type="text" placeholder="搜索姓名或邮箱..." id="searchInput">
                </div>
                <select class="filter-select" id="statusFilter">
                    <option value="">全部状态</option>
                    <option value="new">待处理</option>
                    <option value="read">已查看</option>
                    <option value="replied">已回复</option>
                </select>
            </div>

            <div class="contacts-table">
                <div class="table-header">
                    <div>姓名</div>
                    <div>邮箱</div>
                    <div>留言内容</div>
                    <div>状态</div>
                    <div>操作</div>
                </div>
                <div id="contactsList"></div>
                <div class="empty-state" id="emptyState" style="display: none;">
                    <div class="empty-state-icon">
                        <i data-lucide="inbox" width="64" height="64"></i>
                    </div>
                    <h3 class="empty-state-title">暂无联系记录</h3>
                    <p class="empty-state-desc">访客通过网站联系表单提交的数据将显示在这里</p>
                </div>
            </div>

            <div class="pagination" id="pagination" style="display: none;">
                <button class="page-btn" id="prevBtn"><i data-lucide="chevron-left" width="16"></i></button>
                <div id="pageNumbers"></div>
                <button class="page-btn" id="nextBtn"><i data-lucide="chevron-right" width="16"></i></button>
            </div>
        </div>
    </main>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">联系详情</h2>
                <button class="modal-close" id="detailModalClose">
                    <i data-lucide="x" width="20" height="20"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="detail-group">
                    <div class="detail-label">姓名</div>
                    <div class="detail-value" id="detailName">-</div>
                </div>
                <div class="detail-group">
                    <div class="detail-label">邮箱</div>
                    <div class="detail-value" id="detailEmail">-</div>
                </div>
                <div class="detail-group">
                    <div class="detail-label">提交时间</div>
                    <div class="detail-value" id="detailDate">-</div>
                </div>
                <div class="detail-group">
                    <div class="detail-label">状态</div>
                    <div class="detail-value" id="detailStatus">-</div>
                </div>
                <div class="detail-group">
                    <div class="detail-label">留言内容</div>
                    <div class="detail-message" id="detailMessage">-</div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" id="closeDetailBtn">关闭</button>
                <button class="btn btn-success" id="markRepliedBtn">
                    <i data-lucide="check" width="16" height="16"></i>
                    标记已回复
                </button>
                <a class="btn btn-primary" id="replyByEmailBtn" href="#" target="_blank">
                    <i data-lucide="send" width="16" height="16"></i>
                    回复邮件
                </a>
            </div>
        </div>
    </div>

    <!-- Delete Modal -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal" style="max-width: 400px;">
            <div class="modal-header">
                <h2 class="modal-title">确认删除</h2>
                <button class="modal-close" id="deleteModalClose">
                    <i data-lucide="x" width="20" height="20"></i>
                </button>
            </div>
            <div class="modal-body">
                <p style="text-align: center; padding: 20px;">确定要删除这条联系记录吗？</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" id="cancelDeleteBtn">取消</button>
                <button class="btn btn-danger" id="confirmDeleteBtn">确认删除</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        lucide.createIcons();

        function checkAuth() {
            const session = JSON.parse(localStorage.getItem('portfolio_session') || sessionStorage.getItem('portfolio_session') || 'null');
            if (!session || !session.isLoggedIn) window.location.href = 'admin-login.html';
            return session;
        }

        const session = checkAuth();
        if (session) {
            document.getElementById('userName').textContent = session.username;
            document.getElementById('userAvatar').textContent = session.username.charAt(0).toUpperCase();
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('portfolio_session');
            sessionStorage.removeItem('portfolio_session');
            window.location.href = 'admin-login.html';
        });

        // 数据管理
        let contacts = JSON.parse(localStorage.getItem('portfolio_contacts') || '[]');
        let currentPage = 1;
        const itemsPerPage = 10;
        let deleteContactId = null;
        let detailContactId = null;

        // 统计
        function updateStats() {
            const today = new Date().toDateString();
            const todayContacts = contacts.filter(c => new Date(c.createdAt).toDateString() === today);
            
            document.getElementById('statTotal').textContent = contacts.length;
            document.getElementById('statNew').textContent = contacts.filter(c => c.status === 'new').length;
            document.getElementById('statRead').textContent = contacts.filter(c => c.status === 'read' || c.status === 'replied').length;
            document.getElementById('statToday').textContent = todayContacts.length;
            document.getElementById('contactsBadge').textContent = contacts.length;

            const works = JSON.parse(localStorage.getItem('portfolio_works') || '[]');
            document.getElementById('worksBadge').textContent = works.length;
            
            // 更新待审核简历数量
            const pendingResumeChanges = WorksData.getPendingResumeChanges ? WorksData.getPendingResumeChanges() : [];
            const resumeBadge = document.getElementById('resumeAuditBadge');
            if (resumeBadge) {
                resumeBadge.textContent = pendingResumeChanges.length;
                resumeBadge.style.display = pendingResumeChanges.length > 0 ? 'inline-block' : 'none';
            }
        }

        // 渲染列表
        function renderContacts() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;

            let filtered = contacts.filter(c => {
                const matchSearch = !search || c.name.toLowerCase().includes(search) || c.email.toLowerCase().includes(search);
                const matchStatus = !status || c.status === status;
                return matchSearch && matchStatus;
            });

            const totalPages = Math.ceil(filtered.length / itemsPerPage);
            const start = (currentPage - 1) * itemsPerPage;
            const paginated = filtered.slice(start, start + itemsPerPage);

            const contactsList = document.getElementById('contactsList');
            const emptyState = document.getElementById('emptyState');
            const pagination = document.getElementById('pagination');

            if (filtered.length === 0) {
                contactsList.innerHTML = '';
                emptyState.style.display = 'block';
                pagination.style.display = 'none';
                return;
            }

            emptyState.style.display = 'none';
            pagination.style.display = totalPages > 1 ? 'flex' : 'none';

            contactsList.innerHTML = paginated.map(c => {
                const statusMap = { new: '待处理', read: '已查看', replied: '已回复' };
                const statusClass = `status-${c.status}`;
                return `
                    <div class="contact-row" data-id="${c.id}">
                        <div class="contact-name">${c.name}</div>
                        <div class="contact-email">${c.email}</div>
                        <div class="contact-message">${c.message}</div>
                        <div><span class="contact-status ${statusClass}">${statusMap[c.status]}</span></div>
                        <div class="contact-actions">
                            <button class="action-btn view-btn" data-id="${c.id}" title="查看详情"><i data-lucide="eye" width="16"></i></button>
                            <button class="action-btn delete" data-id="${c.id}" title="删除"><i data-lucide="trash-2" width="16"></i></button>
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            const pageNumbers = document.getElementById('pageNumbers');
            let html = '';

            for (let i = 1; i <= totalPages; i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }

            pageNumbers.innerHTML = html;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages;
        }

        function goToPage(page) {
            currentPage = page;
            renderContacts();
        }

        // 模态框
        function openDetailModal(id) {
            detailContactId = id;
            const contact = contacts.find(c => c.id === id);
            if (!contact) return;

            document.getElementById('detailName').textContent = contact.name;
            document.getElementById('detailEmail').textContent = contact.email;
            document.getElementById('detailDate').textContent = new Date(contact.createdAt).toLocaleString('zh-CN');
            document.getElementById('detailStatus').innerHTML = `<span class="contact-status status-${contact.status}">${contact.status === 'new' ? '待处理' : contact.status === 'read' ? '已查看' : '已回复'}</span>`;
            document.getElementById('detailMessage').textContent = contact.message;
            document.getElementById('replyByEmailBtn').href = `mailto:${contact.email}?subject=回复: 来自张三设计工作室&body=您好 ${contact.name}，`;

            // 标记为已读
            if (contact.status === 'new') {
                contact.status = 'read';
                saveContacts();
                updateStats();
            }

            document.getElementById('detailModal').classList.add('active');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.remove('active');
            detailContactId = null;
        }

        function openDeleteModal(id) {
            deleteContactId = id;
            document.getElementById('deleteModal').classList.add('active');
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('active');
            deleteContactId = null;
        }

        function deleteContact() {
            if (!deleteContactId) return;
            contacts = contacts.filter(c => c.id !== deleteContactId);
            saveContacts();
            renderContacts();
            updateStats();
            closeDeleteModal();
            showToast('记录已删除', 'success');
        }

        function markAsReplied() {
            if (!detailContactId) return;
            const contact = contacts.find(c => c.id === detailContactId);
            if (contact) {
                contact.status = 'replied';
                saveContacts();
                renderContacts();
                updateStats();
                closeDetailModal();
                showToast('已标记为已回复', 'success');
            }
        }

        function saveContacts() {
            localStorage.setItem('portfolio_contacts', JSON.stringify(contacts));
        }

        // 导出
        function exportCSV() {
            if (contacts.length === 0) {
                showToast('暂无数据可导出', 'error');
                return;
            }

            let csv = '\uFEFF'; // BOM for UTF-8
            csv += '姓名,邮箱,留言,状态,提交时间\n';
            
            contacts.forEach(c => {
                const status = c.status === 'new' ? '待处理' : c.status === 'read' ? '已查看' : '已回复';
                csv += `"${c.name}","${c.email}","${c.message.replace(/"/g, '""')}","${status}","${new Date(c.createdAt).toLocaleString('zh-CN')}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `contacts-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            URL.revokeObjectURL(url);

            showToast('CSV 导出成功', 'success');
        }

        function exportJSON() {
            if (contacts.length === 0) {
                showToast('暂无数据可导出', 'error');
                return;
            }

            const blob = new Blob([JSON.stringify(contacts, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `contacts-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);

            showToast('JSON 导出成功', 'success');
        }

        function clearAllContacts() {
            if (contacts.length === 0) {
                showToast('暂无数据可清空', 'error');
                return;
            }

            if (confirm('确定要清空所有联系记录吗？此操作不可恢复！')) {
                if (confirm('这是最后一次确认，是否继续？')) {
                    contacts = [];
                    saveContacts();
                    renderContacts();
                    updateStats();
                    showToast('所有记录已清空', 'success');
                }
            }
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // 事件绑定
        document.getElementById('searchInput').addEventListener('input', () => { currentPage = 1; renderContacts(); });
        document.getElementById('statusFilter').addEventListener('change', () => { currentPage = 1; renderContacts(); });
        document.getElementById('prevBtn').addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderContacts(); } });
        document.getElementById('nextBtn').addEventListener('click', () => { currentPage++; renderContacts(); });

        document.getElementById('detailModalClose').addEventListener('click', closeDetailModal);
        document.getElementById('closeDetailBtn').addEventListener('click', closeDetailModal);
        document.getElementById('markRepliedBtn').addEventListener('click', markAsReplied);

        document.getElementById('deleteModalClose').addEventListener('click', closeDeleteModal);
        document.getElementById('cancelDeleteBtn').addEventListener('click', closeDeleteModal);
        document.getElementById('confirmDeleteBtn').addEventListener('click', deleteContact);

        document.getElementById('exportBtn').addEventListener('click', exportCSV);
        document.getElementById('exportJsonBtn').addEventListener('click', exportJSON);
        document.getElementById('clearAllBtn').addEventListener('click', clearAllContacts);

        // 事件委托
        document.getElementById('contactsList').addEventListener('click', (e) => {
            const viewBtn = e.target.closest('.view-btn');
            const deleteBtn = e.target.closest('.action-btn.delete');
            
            if (viewBtn) {
                const id = parseInt(viewBtn.dataset.id);
                openDetailModal(id);
            }
            
            if (deleteBtn) {
                const id = parseInt(deleteBtn.dataset.id);
                openDeleteModal(id);
            }
        });

        // 初始化演示数据
        if (contacts.length === 0) {
            // 添加一些演示数据
            contacts = [
                { id: 1, name: '李明', email: 'liming@example.com', message: '您好，我对您的品牌设计服务很感兴趣，希望能合作一个咖啡品牌的全案设计项目。', status: 'new', createdAt: new Date().toISOString() },
                { id: 2, name: '王芳', email: 'wangfang@company.cn', message: '看到您的作品集，非常欣赏您的设计风格。我们公司正在寻找一位长期合作的设计师。', status: 'read', createdAt: new Date(Date.now() - 86400000).toISOString() },
                { id: 3, name: '张伟', email: 'zhangwei@gmail.com', message: '请问您接受插画委托吗？我需要一个系列的产品包装插画。', status: 'replied', createdAt: new Date(Date.now() - 172800000).toISOString() }
            ];
            saveContacts();
        }

        renderContacts();
        updateStats();

        // ========== 用户访问追踪 ==========
        (function() {
            const currentPage = 'admin-contacts.html';
            const userId = session?.username || 'admin';

            WorksData.startPageView(currentPage, userId);
            WorksData.recordVisit(currentPage, userId);

            let maxScroll = 0;
            window.addEventListener('scroll', function() {
                const scrollPercent = Math.round((window.scrollY / (document.body.scrollHeight - window.innerHeight)) * 100);
                if (scrollPercent > maxScroll) {
                    maxScroll = scrollPercent;
                    WorksData.updateScrollDepth(maxScroll);
                }
            });

            document.addEventListener('click', function() {
                WorksData.incrementInteractions();
            });

            window.addEventListener('beforeunload', function() {
                WorksData.endPageView();
            });

            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    WorksData.endPageView();
                } else {
                    WorksData.startPageView(currentPage, userId);
                }
            });
        })();
    </script>
</body>
</html>
