<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 | 张三设计工作室</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #1a1a1a;
            --secondary: #666666;
            --accent: #c9a87c;
            --background: #fafafa;
            --surface: #ffffff;
            --muted: #e8e8e8;
            --error: #dc3545;
            --success: #28a745;
            --font-heading: 'Cormorant Garamond', serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--background);
            color: var(--primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: var(--surface);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        }

        .login-header {
            text-align: center;
            margin-bottom: 48px;
        }

        .login-logo {
            font-family: var(--font-heading);
            font-size: 32px;
            font-weight: 600;
            color: var(--primary);
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 14px;
            color: var(--secondary);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .form-group {
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--secondary);
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            font-family: var(--font-body);
            font-size: 15px;
            background: var(--background);
            border: 1px solid var(--muted);
            border-radius: 4px;
            color: var(--primary);
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(201, 168, 124, 0.1);
        }

        .form-input::placeholder {
            color: #aaa;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 38px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--secondary);
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: var(--primary);
        }

        .remember-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .remember-label {
            font-size: 14px;
            color: var(--secondary);
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 500;
            background: var(--primary);
            color: var(--surface);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .submit-btn:hover {
            background: var(--accent);
            transform: translateY(-2px);
        }

        .submit-btn:disabled {
            background: var(--muted);
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            padding: 12px 16px;
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid rgba(220, 53, 69, 0.3);
            border-radius: 4px;
            color: var(--error);
            font-size: 14px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 32px;
            font-size: 14px;
            color: var(--secondary);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: var(--accent);
        }

        .back-link i {
            margin-right: 6px;
        }

        .default-credentials {
            margin-top: 32px;
            padding: 16px;
            background: rgba(201, 168, 124, 0.1);
            border-radius: 4px;
            text-align: center;
        }

        .default-credentials p {
            font-size: 12px;
            color: var(--secondary);
            margin-bottom: 8px;
        }

        .default-credentials code {
            font-family: monospace;
            background: var(--surface);
            padding: 2px 8px;
            border-radius: 2px;
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1 class="login-logo">张三</h1>
            <p class="login-subtitle">设计工作室管理后台</p>
        </div>

        <form class="login-form" id="loginForm">
            <div class="error-message" id="errorMessage">用户名或密码错误</div>

            <div class="form-group">
                <label class="form-label" for="username">用户名</label>
                <input type="text" class="form-input" id="username" name="username" placeholder="请输入用户名" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">密码</label>
                <input type="password" class="form-input" id="password" name="password" placeholder="请输入密码" required>
                <button type="button" class="password-toggle" id="togglePassword">
                    <i data-lucide="eye" width="20" height="20"></i>
                </button>
            </div>

            <div class="remember-row">
                <input type="checkbox" class="checkbox" id="remember" name="remember">
                <label class="remember-label" for="remember">记住登录状态</label>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">登 录</button>
        </form>

        <div class="default-credentials">
            <p>默认账号: admin / admin123</p>
            <p>(首次登录后可自行修改密码)</p>
        </div>

        <a href="index.html" class="back-link">
            <i data-lucide="arrow-left" width="16" height="16"></i>
            返回网站首页
        </a>
    </div>

    <script>
        lucide.createIcons();

        // 密码显示/隐藏
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            const icon = togglePassword.querySelector('i');
            icon.setAttribute('data-lucide', type === 'password' ? 'eye' : 'eye-off');
            lucide.createIcons();
        });

        // 登录表单提交
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const submitBtn = document.getElementById('submitBtn');

        // 初始化默认管理员账号
        function initDefaultAdmin() {
            const admins = JSON.parse(localStorage.getItem('portfolio_admins') || '[]');
            if (admins.length === 0) {
                admins.push({
                    username: 'admin',
                    password: 'admin123',
                    createdAt: new Date().toISOString()
                });
                localStorage.setItem('portfolio_admins', JSON.stringify(admins));
            }
        }

        initDefaultAdmin();

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            submitBtn.textContent = '登录中...';
            submitBtn.disabled = true;
            errorMessage.classList.remove('show');

            // 模拟登录验证
            setTimeout(() => {
                const admins = JSON.parse(localStorage.getItem('portfolio_admins') || '[]');
                const admin = admins.find(a => a.username === username && a.password === password);

                if (admin) {
                    // 创建会话
                    const session = {
                        isLoggedIn: true,
                        username: admin.username,
                        loginTime: new Date().toISOString()
                    };
                    
                    if (remember) {
                        localStorage.setItem('portfolio_session', JSON.stringify(session));
                    } else {
                        sessionStorage.setItem('portfolio_session', JSON.stringify(session));
                    }

                    // 记录登录日志
                    const logs = JSON.parse(localStorage.getItem('portfolio_logs') || '[]');
                    logs.unshift({
                        type: 'login',
                        username: admin.username,
                        time: new Date().toISOString(),
                        ip: '127.0.0.1'
                    });
                    localStorage.setItem('portfolio_logs', JSON.stringify(logs.slice(0, 100)));

                    window.location.href = 'admin-dashboard.html';
                } else {
                    errorMessage.classList.add('show');
                    submitBtn.textContent = '登 录';
                    submitBtn.disabled = false;
                }
            }, 800);
        });

        // 检查是否已登录
        const session = JSON.parse(localStorage.getItem('portfolio_session') || sessionStorage.getItem('portfolio_session') || 'null');
        if (session && session.isLoggedIn) {
            window.location.href = 'admin-dashboard.html';
        }
    </script>
</body>
</html>
