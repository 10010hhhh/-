<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简历审核管理 | 张三设计工作室</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/cloud-api.js?v=2026042601"></script>
    <script src="/data-manager.js?v=2026042601"></script>
    <style>
        :root {
            --primary: #1a1a1a;
            --secondary: #666666;
            --accent: #c9a87c;
            --background: #fafafa;
            --surface: #ffffff;
            --muted: #e8e8e8;
            --error: #dc3545;
            --success: #28a745;
            --warning: #ffc107;
            --font-heading: 'Cormorant Garamond', serif;
            --font-body: 'Inter', sans-serif;
            --sidebar-width: 260px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background-color: var(--background);
            color: var(--primary);
            min-height: 100vh;
        }

        .sidebar {
            position: fixed;
            left: 0; top: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--surface);
            border-right: 1px solid var(--muted);
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .sidebar-header { padding: 24px; border-bottom: 1px solid var(--muted); }
        .sidebar-logo {
            font-family: var(--font-heading);
            font-size: 24px;
            font-weight: 600;
            color: var(--primary);
            letter-spacing: 2px;
            text-decoration: none;
            display: block;
        }
        .sidebar-subtitle { font-size: 12px; color: var(--secondary); margin-top: 4px; }
        .sidebar-nav { flex: 1; padding: 16px 0; overflow-y: auto; }
        .nav-section { margin-bottom: 24px; }
        .nav-section-title {
            padding: 8px 24px;
            font-size: 11px;
            font-weight: 600;
            color: var(--secondary);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            font-size: 14px;
            color: var(--secondary);
            text-decoration: none;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }
        .nav-item:hover { background: var(--background); color: var(--primary); }
        .nav-item.active { background: rgba(201, 168, 124, 0.1); color: var(--accent); border-left-color: var(--accent); }
        .sidebar-footer { padding: 16px 24px; border-top: 1px solid var(--muted); }
        .user-info { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .user-avatar {
            width: 40px; height: 40px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }
        .user-name { font-size: 14px; font-weight: 500; }
        .user-role { font-size: 12px; color: var(--secondary); }
        .logout-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 10px 16px;
            font-family: var(--font-body);
            font-size: 14px;
            background: none;
            border: 1px solid var(--muted);
            border-radius: 4px;
            color: var(--secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .logout-btn:hover { background: var(--error); border-color: var(--error); color: white; }

        .main-content { margin-left: var(--sidebar-width); min-height: 100vh; }
        .topbar {
            position: sticky;
            top: 0;
            background: var(--surface);
            border-bottom: 1px solid var(--muted);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 50;
        }
        .topbar-title { font-size: 20px; font-weight: 600; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 500;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--accent); }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #218838; }
        .btn-danger { background: var(--error); color: white; }
        .btn-danger:hover { background: #c82333; }
        .btn-secondary { background: var(--muted); color: var(--primary); }
        .btn-secondary:hover { background: var(--secondary); color: white; }
        .btn-sm { padding: 6px 12px; font-size: 13px; }

        .content { padding: 32px; }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 4px;
            background: var(--muted);
            padding: 4px;
            border-radius: 8px;
            margin-bottom: 24px;
            width: fit-content;
        }
        .tab {
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            color: var(--secondary);
            background: transparent;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab:hover { color: var(--primary); }
        .tab.active { background: var(--surface); color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .tab-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            background: var(--error);
            color: white;
            font-size: 11px;
            font-weight: 600;
            border-radius: 10px;
            margin-left: 8px;
        }
        .tab.active .tab-badge { background: var(--accent); }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--muted);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .stat-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: rgba(201, 168, 124, 0.1);
            color: var(--accent);
        }
        .stat-value {
            font-family: var(--font-heading);
            font-size: 28px;
            font-weight: 600;
            line-height: 1;
        }
        .stat-label {
            font-size: 13px;
            color: var(--secondary);
            margin-top: 4px;
        }

        /* Cards */
        .card {
            background: var(--surface);
            border: 1px solid var(--muted);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .card-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--muted);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card-title {
            font-family: var(--font-heading);
            font-size: 18px;
            font-weight: 500;
        }
        .card-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 13px;
            color: var(--secondary);
        }
        .card-body { padding: 24px; }

        /* Diff View */
        .diff-list { display: flex; flex-direction: column; gap: 16px; }
        .diff-item {
            background: var(--background);
            border: 1px solid var(--muted);
            border-radius: 8px;
            padding: 16px;
        }
        .diff-field {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 8px;
        }
        .diff-values {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .diff-old, .diff-new {
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.5;
        }
        .diff-old {
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid rgba(220, 53, 69, 0.2);
            color: var(--error);
        }
        .diff-new {
            background: rgba(40, 167, 69, 0.1);
            border: 1px solid rgba(40, 167, 69, 0.2);
            color: var(--success);
        }
        .diff-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .diff-empty { text-align: center; color: var(--secondary); padding: 48px; }

        /* Status */
        .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-pending { background: rgba(255, 193, 7, 0.15); color: #856404; }
        .status-approved { background: rgba(40, 167, 69, 0.15); color: var(--success); }
        .status-rejected { background: rgba(220, 53, 69, 0.15); color: var(--error); }

        /* Actions */
        .card-actions {
            display: flex;
            gap: 8px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .modal-overlay.show { opacity: 1; visibility: visible; }
        .modal {
            background: var(--surface);
            border-radius: 12px;
            padding: 32px;
            width: 90%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        .modal-title {
            font-family: var(--font-heading);
            font-size: 24px;
            font-weight: 500;
        }
        .modal-close {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--secondary);
            transition: color 0.2s ease;
        }
        .modal-close:hover { color: var(--error); }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }
        .form-group { margin-bottom: 20px; }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--primary);
            margin-bottom: 8px;
        }
        .form-textarea {
            width: 100%;
            padding: 12px 16px;
            font-family: var(--font-body);
            font-size: 14px;
            background: var(--background);
            border: 1px solid var(--muted);
            border-radius: 4px;
            outline: none;
            resize: vertical;
            min-height: 100px;
        }
        .form-textarea:focus { border-color: var(--accent); }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px; right: 24px;
            padding: 16px 24px;
            background: var(--primary);
            color: white;
            border-radius: 8px;
            font-size: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--error); }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 40px;
            color: var(--secondary);
        }
        .empty-state-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--muted);
            border-radius: 50%;
            color: var(--secondary);
        }
        .empty-state h3 {
            font-family: var(--font-heading);
            font-size: 20px;
            color: var(--primary);
            margin-bottom: 8px;
        }
        .empty-state p { font-size: 14px; }

        @media (max-width: 1024px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .main-content { margin-left: 0; }
            .content { padding: 16px; }
            .stats-grid { grid-template-columns: 1fr; }
            .tabs { width: 100%; }
            .tab { flex: 1; text-align: center; padding: 10px 12px; }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="index.html" class="sidebar-logo">张三</a>
            <p class="sidebar-subtitle">设计工作室管理后台</p>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section">
                <div class="nav-section-title">概览</div>
                <a href="admin-dashboard.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i>
                    <span>仪表盘</span>
                </a>
                <a href="admin-analytics.html" class="nav-item">
                    <i data-lucide="bar-chart-2"></i>
                    <span>访问分析</span>
                </a>
            </div>
            <div class="nav-section">
                <div class="nav-section-title">内容管理</div>
                <a href="admin-banner.html" class="nav-item">
                    <i data-lucide="layout-template"></i>
                    <span>Banner管理</span>
                </a>
                <a href="admin-works.html" class="nav-item">
                    <i data-lucide="image"></i>
                    <span>作品管理</span>
                </a>
                <a href="admin-about.html" class="nav-item">
                    <i data-lucide="user"></i>
                    <span>设计师简介</span>
                </a>
                <a href="admin-resume.html" class="nav-item">
                    <i data-lucide="file-text"></i>
                    <span>个人简历</span>
                </a>
                <a href="admin-resume-audit.html" class="nav-item active">
                    <i data-lucide="git-pull-request"></i>
                    <span>简历审核</span>
                </a>
                <a href="admin-contacts.html" class="nav-item">
                    <i data-lucide="mail"></i>
                    <span>联系数据</span>
                </a>
            </div>
            <div class="nav-section">
                <div class="nav-section-title">系统</div>
                <a href="admin-settings.html" class="nav-item">
                    <i data-lucide="settings"></i>
                    <span>设置</span>
                </a>
            </div>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">A</div>
                <div>
                    <div class="user-name" id="userName">Admin</div>
                    <div class="user-role">管理员</div>
                </div>
            </div>
            <button class="logout-btn" id="logoutBtn">
                <i data-lucide="log-out" width="18" height="18"></i>
                退出登录
            </button>
        </div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <h1 class="topbar-title">简历审核管理</h1>
            <div style="display: flex; gap: 12px;">
                <a href="admin-resume.html" class="btn btn-secondary">
                    <i data-lucide="edit-3" width="18" height="18"></i>
                    编辑简历
                </a>
                <button class="btn btn-secondary" onclick="refreshData()">
                    <i data-lucide="refresh-cw" width="18" height="18"></i>
                    刷新
                </button>
            </div>
        </header>

        <div class="content">
            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">
                        <i data-lucide="clock" width="24" height="24"></i>
                    </div>
                    <div>
                        <div class="stat-value" id="pendingCount">0</div>
                        <div class="stat-label">待审核</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(40, 167, 69, 0.1); color: var(--success);">
                        <i data-lucide="check-circle" width="24" height="24"></i>
                    </div>
                    <div>
                        <div class="stat-value" id="approvedCount">0</div>
                        <div class="stat-label">已通过</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(220, 53, 69, 0.1); color: var(--error);">
                        <i data-lucide="x-circle" width="24" height="24"></i>
                    </div>
                    <div>
                        <div class="stat-value" id="rejectedCount">0</div>
                        <div class="stat-label">已拒绝</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(102, 102, 102, 0.1); color: var(--secondary);">
                        <i data-lucide="history" width="24" height="24"></i>
                    </div>
                    <div>
                        <div class="stat-value" id="totalCount">0</div>
                        <div class="stat-label">总记录</div>
                    </div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab active" data-tab="pending">
                    待审核
                    <span class="tab-badge" id="pendingBadge" style="display: none;">0</span>
                </button>
                <button class="tab" data-tab="approved">已通过</button>
                <button class="tab" data-tab="rejected">已拒绝</button>
                <button class="tab" data-tab="all">全部记录</button>
            </div>

            <!-- Pending List -->
            <div id="pendingList"></div>
            <div id="historyList"></div>
        </div>
    </main>

    <!-- Reject Modal -->
    <div class="modal-overlay" id="rejectModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">拒绝修改</h3>
                <button class="modal-close" onclick="closeRejectModal()">
                    <i data-lucide="x" width="20" height="20"></i>
                </button>
            </div>
            <div class="form-group">
                <label class="form-label">拒绝原因</label>
                <textarea class="form-textarea" id="rejectReason" placeholder="请输入拒绝原因，以便申请人了解情况..."></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeRejectModal()">取消</button>
                <button class="btn btn-danger" id="confirmRejectBtn">确认拒绝</button>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal" style="max-width: 900px;">
            <div class="modal-header">
                <h3 class="modal-title">修改详情</h3>
                <button class="modal-close" onclick="closeDetailModal()">
                    <i data-lucide="x" width="20" height="20"></i>
                </button>
            </div>
            <div id="detailContent"></div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeDetailModal()">关闭</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        lucide.createIcons();

        function checkAuth() {
            const session = JSON.parse(localStorage.getItem('portfolio_session') || sessionStorage.getItem('portfolio_session') || 'null');
            if (!session || !session.isLoggedIn) window.location.href = 'admin-login.html';
            return session;
        }

        const session = checkAuth();
        let currentTab = 'pending';
        let currentRejectId = null;

        if (session) {
            document.getElementById('userName').textContent = session.username;
            document.getElementById('userAvatar').textContent = session.username.charAt(0).toUpperCase();
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('portfolio_session');
            sessionStorage.removeItem('portfolio_session');
            window.location.href = 'admin-login.html';
        });

        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentTab = tab.dataset.tab;
                renderList();
            });
        });

        function refreshData() {
            updateStats();
            renderList();
            showToast('数据已刷新', 'success');
        }

        function updateStats() {
            const pending = WorksData.getPendingResumeChanges();
            const history = WorksData.getResumeAuditHistory();
            const approved = history.filter(h => h.status === 'approved');
            const rejected = history.filter(h => h.status === 'rejected');

            document.getElementById('pendingCount').textContent = pending.length;
            document.getElementById('approvedCount').textContent = approved.length;
            document.getElementById('rejectedCount').textContent = rejected.length;
            document.getElementById('totalCount').textContent = pending.length + history.length;

            const badge = document.getElementById('pendingBadge');
            if (pending.length > 0) {
                badge.textContent = pending.length;
                badge.style.display = 'inline-flex';
            } else {
                badge.style.display = 'none';
            }
        }

        function renderList() {
            const pendingList = document.getElementById('pendingList');
            const historyList = document.getElementById('historyList');

            if (currentTab === 'pending') {
                pendingList.style.display = 'block';
                historyList.style.display = 'none';
                renderPendingList(pendingList);
            } else {
                pendingList.style.display = 'none';
                historyList.style.display = 'block';
                renderHistoryList(historyList);
            }
        }

        function renderPendingList(container) {
            const pending = WorksData.getPendingResumeChanges();

            if (pending.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <i data-lucide="check-circle" width="40" height="40"></i>
                        </div>
                        <h3>暂无待审核内容</h3>
                        <p>所有简历修改都已审核完毕</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            container.innerHTML = pending.map(item => `
                <div class="card">
                    <div class="card-header">
                        <div>
                            <span class="card-title">简历修改申请</span>
                            <div class="card-meta">
                                <span><i data-lucide="user" width="14" height="14"></i> ${item.operator}</span>
                                <span><i data-lucide="clock" width="14" height="14"></i> ${formatTime(item.submittedAt)}</span>
                                <span class="status status-pending">
                                    <i data-lucide="circle" width="12" height="12"></i>
                                    待审核
                                </span>
                            </div>
                        </div>
                        <div class="card-actions">
                            <button class="btn btn-sm btn-secondary" onclick="showDetail(${item.id})">
                                <i data-lucide="eye" width="14" height="14"></i>
                                查看详情
                            </button>
                            <button class="btn btn-sm btn-success" onclick="approveChange(${item.id})">
                                <i data-lucide="check" width="14" height="14"></i>
                                通过
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="showRejectModal(${item.id})">
                                <i data-lucide="x" width="14" height="14"></i>
                                拒绝
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="diff-list">
                            ${item.diff && item.diff.length > 0 ? item.diff.map(d => `
                                <div class="diff-item">
                                    <div class="diff-field">${d.field}</div>
                                    <div class="diff-values">
                                        <div class="diff-old">
                                            <div class="diff-label">修改前</div>
                                            ${escapeHtml(String(d.old))}
                                        </div>
                                        <div class="diff-new">
                                            <div class="diff-label">修改后</div>
                                            ${escapeHtml(String(d.new))}
                                        </div>
                                    </div>
                                </div>
                            `).join('') : '<p style="color: var(--secondary);">数据已变更</p>'}
                        </div>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function renderHistoryList(container) {
            const history = WorksData.getResumeAuditHistory();
            let filtered = history;

            if (currentTab === 'approved') {
                filtered = history.filter(h => h.status === 'approved');
            } else if (currentTab === 'rejected') {
                filtered = history.filter(h => h.status === 'rejected');
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <i data-lucide="archive" width="40" height="40"></i>
                        </div>
                        <h3>暂无历史记录</h3>
                        <p>审核记录将显示在这里</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            container.innerHTML = filtered.map(item => `
                <div class="card">
                    <div class="card-header">
                        <div>
                            <span class="card-title">简历修改 - ${item.status === 'approved' ? '已通过' : '已拒绝'}</span>
                            <div class="card-meta">
                                <span><i data-lucide="user" width="14" height="14"></i> 申请人: ${item.operator}</span>
                                <span><i data-lucide="calendar" width="14" height="14"></i> 提交: ${formatTime(item.submittedAt)}</span>
                                ${item.reviewer ? `<span><i data-lucide="user-check" width="14" height="14"></i> 审核: ${item.reviewer}</span>` : ''}
                                <span class="status status-${item.status}">
                                    <i data-lucide="${item.status === 'approved' ? 'check-circle' : 'x-circle'}" width="12" height="12"></i>
                                    ${item.status === 'approved' ? '已通过' : '已拒绝'}
                                </span>
                            </div>
                        </div>
                        <div class="card-actions">
                            <button class="btn btn-sm btn-secondary" onclick="showDetail(${item.id})">
                                <i data-lucide="eye" width="14" height="14"></i>
                                查看详情
                            </button>
                        </div>
                    </div>
                    ${item.rejectReason ? `
                    <div class="card-body">
                        <div style="padding: 12px; background: rgba(220, 53, 69, 0.1); border-radius: 6px; color: var(--error); font-size: 14px;">
                            <strong>拒绝原因：</strong>${escapeHtml(item.rejectReason)}
                        </div>
                    </div>
                    ` : ''}
                </div>
            `).join('');
            lucide.createIcons();
        }

        function approveChange(id) {
            if (!confirm('确定要通过这条修改吗？')) return;
            
            WorksData.approveResumeChange(id, session?.username || 'admin');
            updateStats();
            renderList();
            showToast('修改已通过', 'success');
        }

        function showRejectModal(id) {
            currentRejectId = id;
            document.getElementById('rejectReason').value = '';
            document.getElementById('rejectModal').classList.add('show');
            
            document.getElementById('confirmRejectBtn').onclick = () => {
                const reason = document.getElementById('rejectReason').value.trim();
                WorksData.rejectResumeChange(currentRejectId, session?.username || 'admin', reason);
                closeRejectModal();
                updateStats();
                renderList();
                showToast('修改已拒绝', 'success');
            };
        }

        function closeRejectModal() {
            document.getElementById('rejectModal').classList.remove('show');
            currentRejectId = null;
        }

        function showDetail(id) {
            const pending = WorksData.getPendingResumeChanges().find(p => p.id === id);
            const history = WorksData.getResumeAuditHistory().find(h => h.id === id);
            const item = pending || history;

            if (!item) {
                showToast('记录不存在', 'error');
                return;
            }

            const content = document.getElementById('detailContent');
            content.innerHTML = `
                <div style="margin-bottom: 24px;">
                    <div class="card-meta" style="margin-bottom: 16px;">
                        <span><i data-lucide="user" width="14" height="14"></i> 申请人: ${item.operator}</span>
                        <span><i data-lucide="clock" width="14" height="14"></i> 提交时间: ${formatTime(item.submittedAt)}</span>
                        ${item.reviewer ? `<span><i data-lucide="user-check" width="14" height="14"></i> 审核人: ${item.reviewer}</span>` : ''}
                        ${item.reviewedAt ? `<span><i data-lucide="check" width="14" height="14"></i> 审核时间: ${formatTime(item.reviewedAt)}</span>` : ''}
                    </div>
                    <span class="status status-${item.status}">
                        <i data-lucide="${item.status === 'approved' ? 'check-circle' : item.status === 'rejected' ? 'x-circle' : 'circle'}" width="12" height="12"></i>
                        ${item.status === 'pending' ? '待审核' : item.status === 'approved' ? '已通过' : '已拒绝'}
                    </span>
                </div>
                
                <h4 style="margin-bottom: 16px; font-size: 14px; color: var(--secondary); text-transform: uppercase; letter-spacing: 1px;">修改内容</h4>
                <div class="diff-list">
                    ${item.diff && item.diff.length > 0 ? item.diff.map(d => `
                        <div class="diff-item">
                            <div class="diff-field">${d.field}</div>
                            <div class="diff-values">
                                <div class="diff-old">
                                    <div class="diff-label">修改前</div>
                                    ${escapeHtml(String(d.old))}
                                </div>
                                <div class="diff-new">
                                    <div class="diff-label">修改后</div>
                                    ${escapeHtml(String(d.new))}
                                </div>
                            </div>
                        </div>
                    `).join('') : '<p style="color: var(--secondary);">数据已变更</p>'}
                </div>
                
                ${item.rejectReason ? `
                <div style="margin-top: 24px; padding: 16px; background: rgba(220, 53, 69, 0.1); border-radius: 8px;">
                    <h4 style="margin-bottom: 8px; color: var(--error); font-size: 14px;">拒绝原因</h4>
                    <p style="color: var(--primary); font-size: 14px;">${escapeHtml(item.rejectReason)}</p>
                </div>
                ` : ''}
            `;
            lucide.createIcons();
            document.getElementById('detailModal').classList.add('show');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.remove('show');
        }

        function formatTime(isoString) {
            if (!isoString) return '-';
            const date = new Date(isoString);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Initialize
        updateStats();
        renderList();
    </script>
</body>
</html>
