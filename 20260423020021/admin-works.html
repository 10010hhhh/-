<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品管理 | 张三设计工作室</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/hh/cloud-api.js?v=2026042304"></script>
    <script src="/hh/data-manager.js?v=2026042304"></script>
    <style>
        :root {
            --primary: #1a1a1a;
            --secondary: #666666;
            --accent: #c9a87c;
            --background: #fafafa;
            --surface: #ffffff;
            --muted: #e8e8e8;
            --error: #dc3545;
            --success: #28a745;
            --warning: #ffc107;
            --font-heading: 'Cormorant Garamond', serif;
            --font-body: 'Inter', sans-serif;
            --sidebar-width: 260px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background-color: var(--background);
            color: var(--primary);
            min-height: 100vh;
        }

        .sidebar {
            position: fixed;
            left: 0; top: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--surface);
            border-right: 1px solid var(--muted);
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .sidebar-header { padding: 24px; border-bottom: 1px solid var(--muted); }
        .sidebar-logo {
            font-family: var(--font-heading);
            font-size: 24px;
            font-weight: 600;
            color: var(--primary);
            letter-spacing: 2px;
            text-decoration: none;
            display: block;
        }
        .sidebar-subtitle { font-size: 12px; color: var(--secondary); margin-top: 4px; }
        .sidebar-nav { flex: 1; padding: 16px 0; overflow-y: auto; }
        .nav-section { margin-bottom: 24px; }
        .nav-section-title {
            padding: 8px 24px;
            font-size: 11px;
            font-weight: 600;
            color: var(--secondary);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            font-size: 14px;
            color: var(--secondary);
            text-decoration: none;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }
        .nav-item:hover { background: var(--background); color: var(--primary); }
        .nav-item.active { background: rgba(201, 168, 124, 0.1); color: var(--accent); border-left-color: var(--accent); }
        .nav-badge {
            margin-left: auto;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 600;
            background: var(--error);
            color: white;
            border-radius: 10px;
        }
        .sidebar-footer { padding: 16px 24px; border-top: 1px solid var(--muted); }
        .user-info { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .user-avatar {
            width: 40px; height: 40px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }
        .user-name { font-size: 14px; font-weight: 500; }
        .user-role { font-size: 12px; color: var(--secondary); }
        .logout-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 10px 16px;
            font-family: var(--font-body);
            font-size: 14px;
            background: none;
            border: 1px solid var(--muted);
            border-radius: 4px;
            color: var(--secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .logout-btn:hover { background: var(--error); border-color: var(--error); color: white; }

        .main-content { margin-left: var(--sidebar-width); min-height: 100vh; }
        .topbar {
            position: sticky;
            top: 0;
            background: var(--surface);
            border-bottom: 1px solid var(--muted);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 50;
        }
        .topbar-title { font-size: 20px; font-weight: 600; }
        .topbar-actions { display: flex; align-items: center; gap: 16px; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 500;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--accent); }
        .btn-outline { background: none; border: 1px solid var(--muted); color: var(--secondary); }
        .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
        .btn-danger { background: var(--error); color: white; }
        .btn-danger:hover { background: #c82333; }
        .content { padding: 32px; }

        .filter-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: var(--surface);
            border: 1px solid var(--muted);
            border-radius: 4px;
            flex: 1;
            max-width: 400px;
        }
        .search-box input {
            flex: 1;
            border: none;
            background: none;
            font-family: var(--font-body);
            font-size: 14px;
            outline: none;
        }
        .filter-select {
            padding: 10px 16px;
            font-family: var(--font-body);
            font-size: 14px;
            background: var(--surface);
            border: 1px solid var(--muted);
            border-radius: 4px;
            cursor: pointer;
            outline: none;
        }

        .works-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }
        .work-card {
            background: var(--surface);
            border-radius: 8px;
            border: 1px solid var(--muted);
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .work-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }
        .work-card-image {
            position: relative;
            aspect-ratio: 16/10;
            overflow: hidden;
        }
        .work-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .work-card:hover .work-card-image img { transform: scale(1.05); }
        .work-card-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .work-card:hover .work-card-overlay { opacity: 1; }
        .work-card-actions { display: flex; gap: 8px; }
        .work-card-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .work-card-btn:hover { background: var(--accent); color: white; }
        .work-card-btn.delete:hover { background: var(--error); }
        .work-card-body { padding: 20px; }
        .work-card-category {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .work-card-title { font-family: var(--font-heading); font-size: 20px; margin-bottom: 4px; }
        .work-card-meta {
            font-size: 13px;
            color: var(--secondary);
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .work-card-meta span { display: flex; align-items: center; gap: 4px; }
        .work-card-footer {
            padding: 12px 20px;
            border-top: 1px solid var(--muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .work-card-status {
            font-size: 12px;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 12px;
        }
        .status-published { background: rgba(40, 167, 69, 0.1); color: var(--success); }
        .status-draft { background: rgba(255, 193, 7, 0.1); color: var(--warning); }

        .empty-state {
            text-align: center;
            padding: 80px 40px;
            background: var(--surface);
            border-radius: 8px;
            border: 1px solid var(--muted);
        }
        .empty-state-icon { width: 80px; height: 80px; margin: 0 auto 24px; color: var(--muted); }
        .empty-state-title { font-family: var(--font-heading); font-size: 24px; margin-bottom: 8px; }
        .empty-state-desc { font-size: 14px; color: var(--secondary); margin-bottom: 24px; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal {
            background: var(--surface);
            border-radius: 12px;
            width: 90%;
            max-width: 700px;
            max-height: 90vh;
            overflow: hidden;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal { transform: translateY(0); }
        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--muted);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-title { font-size: 18px; font-weight: 600; }
        .modal-close {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .modal-close:hover { background: var(--muted); }
        .modal-body { padding: 24px; max-height: 60vh; overflow-y: auto; }
        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--muted);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .form-group { margin-bottom: 20px; }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--primary);
            margin-bottom: 8px;
        }
        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 12px 16px;
            font-family: var(--font-body);
            font-size: 14px;
            background: var(--background);
            border: 1px solid var(--muted);
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s ease;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
        .form-textarea { resize: vertical; min-height: 100px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        .image-upload-area {
            border: 2px dashed var(--muted);
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .image-upload-area:hover {
            border-color: var(--accent);
            background: rgba(201, 168, 124, 0.05);
        }
        .image-upload-area.dragover { border-color: var(--accent); background: rgba(201, 168, 124, 0.1); }
        .image-upload-icon { width: 48px; height: 48px; margin: 0 auto 16px; color: var(--secondary); }
        .image-upload-text { font-size: 14px; color: var(--secondary); margin-bottom: 8px; }
        .image-upload-hint { font-size: 12px; color: #aaa; }

        .image-preview {
            margin-top: 16px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
        }
        .image-preview-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 4px;
            overflow: hidden;
        }
        .image-preview-item img { width: 100%; height: 100%; object-fit: cover; }
        .image-preview-remove {
            position: absolute;
            top: 4px; right: 4px;
            width: 24px; height: 24px;
            border-radius: 50%;
            background: var(--error);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .image-preview-item:hover .image-preview-remove { opacity: 1; }
        .gallery-preview { margin-top: 16px; }
        .gallery-preview-title { font-size: 13px; font-weight: 500; margin-bottom: 12px; }

        .delete-confirm { text-align: center; padding: 20px; }
        .delete-confirm-icon { width: 64px; height: 64px; margin: 0 auto 20px; color: var(--error); }
        .delete-confirm-text { font-size: 16px; margin-bottom: 8px; }
        .delete-confirm-hint { font-size: 14px; color: var(--secondary); }

        .toast {
            position: fixed;
            bottom: 24px; right: 24px;
            padding: 16px 24px;
            background: var(--primary);
            color: white;
            border-radius: 8px;
            font-size: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--error); }

        @media (max-width: 1200px) { .works-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; }
            .works-grid { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
            .content { padding: 16px; }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="index.html" class="sidebar-logo">张三</a>
            <p class="sidebar-subtitle">设计工作室管理后台</p>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section">
                <div class="nav-section-title">概览</div>
                <a href="admin-dashboard.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i>
                    <span>仪表盘</span>
                </a>
                <a href="admin-analytics.html" class="nav-item">
                    <i data-lucide="bar-chart-2"></i>
                    <span>访问分析</span>
                </a>
            </div>
            <div class="nav-section">
                <div class="nav-section-title">内容管理</div>
                <a href="admin-banner.html" class="nav-item">
                    <i data-lucide="layout-template"></i>
                    <span>Banner管理</span>
                </a>
                <a href="admin-works.html" class="nav-item active">
                    <i data-lucide="image"></i>
                    <span>作品管理</span>
                    <span class="nav-badge" id="worksBadge">0</span>
                </a>
                <a href="admin-about.html" class="nav-item">
                    <i data-lucide="user"></i>
                    <span>设计师简介</span>
                </a>
                <a href="admin-resume.html" class="nav-item">
                    <i data-lucide="file-text"></i>
                    <span>个人简历</span>
                    <span class="nav-badge" id="resumeAuditBadge">0</span>
                </a>
                <a href="admin-contacts.html" class="nav-item">
                    <i data-lucide="mail"></i>
                    <span>联系数据</span>
                    <span class="nav-badge" id="contactsBadge">0</span>
                </a>
            </div>
            <div class="nav-section">
                <div class="nav-section-title">系统</div>
                <a href="admin-settings.html" class="nav-item">
                    <i data-lucide="settings"></i>
                    <span>设置</span>
                </a>
            </div>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">A</div>
                <div>
                    <div class="user-name" id="userName">Admin</div>
                    <div class="user-role">管理员</div>
                </div>
            </div>
            <button class="logout-btn" id="logoutBtn">
                <i data-lucide="log-out" width="18" height="18"></i>
                退出登录
            </button>
        </div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <h1 class="topbar-title">作品管理</h1>
            <div class="topbar-actions">
                <button class="btn btn-primary" id="addWorkBtn">
                    <i data-lucide="plus" width="18" height="18"></i>
                    添加作品
                </button>
            </div>
        </header>

        <div class="content">
            <div class="filter-bar">
                <div class="search-box">
                    <i data-lucide="search" width="18" height="18"></i>
                    <input type="text" placeholder="搜索作品..." id="searchInput">
                </div>
                <select class="filter-select" id="categoryFilter">
                    <option value="">全部分类</option>
                    <option value="品牌设计">品牌设计</option>
                    <option value="包装设计">包装设计</option>
                    <option value="活动视觉">活动视觉</option>
                    <option value="插画创作">插画创作</option>
                </select>
            </div>

            <div class="works-grid" id="worksGrid"></div>

            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-state-icon">
                    <i data-lucide="image-off" width="80" height="80"></i>
                </div>
                <h3 class="empty-state-title">暂无作品</h3>
                <p class="empty-state-desc">点击上方按钮添加您的第一个作品</p>
                <button class="btn btn-primary" id="emptyAddBtn">
                    <i data-lucide="plus" width="18" height="18"></i>
                    添加作品
                </button>
            </div>
        </div>
    </main>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="workModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">添加作品</h2>
                <button class="modal-close" id="modalClose">
                    <i data-lucide="x" width="20" height="20"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="workForm">
                    <input type="hidden" id="workId">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">作品标题 *</label>
                            <input type="text" class="form-input" id="workTitle" required placeholder="输入作品名称">
                        </div>
                        <div class="form-group">
                            <label class="form-label">作品分类 *</label>
                            <select class="form-select" id="workCategory" required>
                                <option value="">选择分类</option>
                                <option value="品牌设计">品牌设计</option>
                                <option value="包装设计">包装设计</option>
                                <option value="活动视觉">活动视觉</option>
                                <option value="插画创作">插画创作</option>
                                <option value="UI设计">UI设计</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">年份</label>
                            <input type="text" class="form-input" id="workYear" placeholder="如: 2024">
                        </div>
                        <div class="form-group">
                            <label class="form-label">项目周期</label>
                            <input type="text" class="form-input" id="workDuration" placeholder="如: 3个月">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">作品描述</label>
                        <textarea class="form-textarea" id="workDesc" placeholder="简短描述作品..."></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">封面图片 *</label>
                        <div class="image-upload-area" id="coverUploadArea">
                            <div class="image-upload-icon">
                                <i data-lucide="upload-cloud" width="48" height="48"></i>
                            </div>
                            <p class="image-upload-text">点击或拖拽上传封面图片</p>
                            <p class="image-upload-hint">支持 JPG, PNG, WebP 格式，建议尺寸 1400x800</p>
                            <input type="file" id="coverInput" accept="image/*" style="display: none;">
                        </div>
                        <div class="image-preview" id="coverPreview"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">作品图库</label>
                        <div class="image-upload-area" id="galleryUploadArea">
                            <div class="image-upload-icon">
                                <i data-lucide="images" width="48" height="48"></i>
                            </div>
                            <p class="image-upload-text">点击或拖拽上传多张图片</p>
                            <p class="image-upload-hint">支持 JPG, PNG, WebP 格式</p>
                            <input type="file" id="galleryInput" accept="image/*" multiple style="display: none;">
                        </div>
                        <div class="gallery-preview" id="galleryPreview">
                            <p class="gallery-preview-title">已选择 <span id="galleryCount">0</span> 张图片</p>
                            <div class="image-preview" id="galleryImagePreview"></div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" id="cancelBtn">取消</button>
                <button type="button" class="btn btn-primary" id="saveBtn">保存</button>
            </div>
        </div>
    </div>

    <!-- Delete Modal -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal" style="max-width: 400px;">
            <div class="modal-header">
                <h2 class="modal-title">确认删除</h2>
                <button class="modal-close" id="deleteModalClose">
                    <i data-lucide="x" width="20" height="20"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="delete-confirm">
                    <div class="delete-confirm-icon">
                        <i data-lucide="alert-triangle" width="64" height="64"></i>
                    </div>
                    <p class="delete-confirm-text">确定要删除作品「<span id="deleteWorkTitle"></span>」吗？</p>
                    <p class="delete-confirm-hint">此操作不可恢复，相关数据将被永久删除</p>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" id="cancelDeleteBtn">取消</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">确认删除</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        console.log('[Admin] Page loading...');
        lucide.createIcons();
        console.log('[Admin] Lucide icons initialized');

        function checkAuth() {
            const session = JSON.parse(localStorage.getItem('portfolio_session') || sessionStorage.getItem('portfolio_session') || 'null');
            if (!session || !session.isLoggedIn) window.location.href = 'admin-login.html';
            return session;
        }

        const session = checkAuth();
        if (session) {
            document.getElementById('userName').textContent = session.username;
            document.getElementById('userAvatar').textContent = session.username.charAt(0).toUpperCase();
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('portfolio_session');
            sessionStorage.removeItem('portfolio_session');
            window.location.href = 'admin-login.html';
        });

        // Use WorksData for data operations
        let currentWorks = WorksData.getWorks();
        let editingWorkId = null, deleteWorkId = null;
        let coverImageData = null, galleryImageData = [];

        const worksGrid = document.getElementById('worksGrid');
        const emptyState = document.getElementById('emptyState');
        const workModal = document.getElementById('workModal');
        const deleteModal = document.getElementById('deleteModal');
        const workForm = document.getElementById('workForm');
        const searchInput = document.getElementById('searchInput');
        const categoryFilter = document.getElementById('categoryFilter');

        function renderWorks(works) {
            const filtered = works.filter(work => {
                const search = searchInput.value.toLowerCase();
                const category = categoryFilter.value;
                const matchSearch = !search || work.title.toLowerCase().includes(search) || work.desc?.toLowerCase().includes(search);
                const matchCategory = !category || work.category === category;
                return matchSearch && matchCategory;
            });

            if (filtered.length === 0) { worksGrid.innerHTML = ''; emptyState.style.display = 'block'; return; }
            emptyState.style.display = 'none';

            worksGrid.innerHTML = filtered.map(work => `
                <div class="work-card" data-id="${work.id}">
                    <div class="work-card-image">
                        <img src="${work.mainImage}" alt="${work.title}">
                        <div class="work-card-overlay">
                            <div class="work-card-actions">
                                <button class="work-card-btn edit-btn" data-id="${work.id}" title="编辑"><i data-lucide="edit-2" width="18" height="18"></i></button>
                                <button class="work-card-btn delete" data-id="${work.id}" title="删除"><i data-lucide="trash-2" width="18" height="18"></i></button>
                            </div>
                        </div>
                    </div>
                    <div class="work-card-body">
                        <div class="work-card-category">${work.category}</div>
                        <h3 class="work-card-title">${work.title}</h3>
                        <div class="work-card-meta">
                            <span><i data-lucide="calendar" width="14" height="14"></i> ${work.year || '-'}</span>
                            <span><i data-lucide="image" width="14" height="14"></i> ${(work.gallery || []).length + 1} 张</span>
                        </div>
                    </div>
                    <div class="work-card-footer">
                        <span class="work-card-status ${work.status === 'published' ? 'status-published' : 'status-draft'}">${work.status === 'published' ? '已发布' : '草稿'}</span>
                        <span style="font-size: 12px; color: var(--secondary);">${formatDate(work.createdAt)}</span>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
            updateBadge();
        }

        function updateBadge() { 
            document.getElementById('worksBadge').textContent = WorksData.getWorks().length;
            const contacts = JSON.parse(localStorage.getItem('portfolio_contacts') || '[]');
            document.getElementById('contactsBadge').textContent = contacts.length;
            
            // 更新待审核简历数量
            const pendingResumeChanges = WorksData.getPendingResumeChanges ? WorksData.getPendingResumeChanges() : [];
            const resumeBadge = document.getElementById('resumeAuditBadge');
            if (resumeBadge) {
                resumeBadge.textContent = pendingResumeChanges.length;
                resumeBadge.style.display = pendingResumeChanges.length > 0 ? 'inline-block' : 'none';
            }
        }

        function formatDate(isoString) {
            if (!isoString) return '-';
            const date = new Date(isoString);
            return date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
        }

        function openWorkModal(work = null) {
            editingWorkId = work ? work.id : null;
            coverImageData = null;
            galleryImageData = [];
            document.getElementById('modalTitle').textContent = work ? '编辑作品' : '添加作品';
            document.getElementById('coverPreview').innerHTML = '';
            document.getElementById('galleryImagePreview').innerHTML = '';
            document.getElementById('galleryCount').textContent = '0';

            if (work) {
                document.getElementById('workId').value = work.id;
                document.getElementById('workTitle').value = work.title;
                document.getElementById('workCategory').value = work.category;
                document.getElementById('workYear').value = work.year || '';
                document.getElementById('workDuration').value = work.duration || '';
                document.getElementById('workDesc').value = work.desc || '';
                if (work.mainImage) {
                    document.getElementById('coverPreview').innerHTML = `<div class="image-preview-item"><img src="${work.mainImage}" alt="封面"></div>`;
                    coverImageData = work.mainImage;
                }
                if (work.gallery && work.gallery.length > 0) {
                    galleryImageData = [...work.gallery];
                    document.getElementById('galleryCount').textContent = galleryImageData.length;
                    document.getElementById('galleryImagePreview').innerHTML = galleryImageData.map((img, i) => `<div class="image-preview-item"><img src="${img}" alt="图库 ${i + 1}"><button type="button" class="image-preview-remove" onclick="removeGalleryImage(${i})"><i data-lucide="x" width="14" height="14"></i></button></div>`).join('');
                    lucide.createIcons();
                }
            } else { workForm.reset(); }
            workModal.classList.add('active');
        }

        function closeWorkModal() { workModal.classList.remove('active'); editingWorkId = null; }

        function openDeleteModal(workId) {
            deleteWorkId = workId;
            const work = currentWorks.find(w => w.id === workId);
            document.getElementById('deleteWorkTitle').textContent = work.title;
            deleteModal.classList.add('active');
        }

        function closeDeleteModal() { deleteModal.classList.remove('active'); deleteWorkId = null; }

        function saveWork() {
            const title = document.getElementById('workTitle').value.trim();
            const category = document.getElementById('workCategory').value;
            if (!title || !category) { showToast('请填写必填项', 'error'); return; }

            const workData = {
                id: editingWorkId || Date.now(),
                title,
                category,
                year: document.getElementById('workYear').value.trim(),
                duration: document.getElementById('workDuration').value.trim(),
                desc: document.getElementById('workDesc').value.trim(),
                mainImage: coverImageData || 'https://images.unsplash.com/photo-1634942537034-2531766767d1?w=800&h=500&fit=crop',
                gallery: galleryImageData,
                status: 'published',
                createdAt: editingWorkId ? currentWorks.find(w => w.id === editingWorkId)?.createdAt : new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };

            console.log('[Admin] Saving work:', workData.title, 'mainImage:', workData.mainImage ? 'has image' : 'no image');

            if (editingWorkId) {
                currentWorks = WorksData.updateWork(editingWorkId, workData);
                WorksData.addLog('work_edit', `编辑作品: ${workData.title}`);
                showToast('作品已更新', 'success');
            } else {
                currentWorks = WorksData.addWork(workData);
                WorksData.addLog('work_add', `新增作品: ${workData.title}`);
                showToast('作品已添加', 'success');
            }
            
            // 强制刷新缓存版本
            WorksData.incrementCacheVersion();
            console.log('[Admin] Cache version updated');
            
            renderWorks(currentWorks);
            closeWorkModal();
        }

        function setupImageUpload(areaId, inputId, isMultiple = false) {
            const area = document.getElementById(areaId);
            const input = document.getElementById(inputId);
            area.addEventListener('click', () => input.click());
            area.addEventListener('dragover', (e) => { e.preventDefault(); area.classList.add('dragover'); });
            area.addEventListener('dragleave', () => area.classList.remove('dragover'));
            area.addEventListener('drop', (e) => { e.preventDefault(); area.classList.remove('dragover'); handleFiles(e.dataTransfer.files, isMultiple); });
            input.addEventListener('change', () => { handleFiles(input.files, isMultiple); input.value = ''; });
        }

        function handleFiles(files, isMultiple) {
            Array.from(files).forEach(file => {
                if (!file.type.startsWith('image/')) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    if (isMultiple) {
                        galleryImageData.push(e.target.result);
                        document.getElementById('galleryCount').textContent = galleryImageData.length;
                        renderGalleryPreview();
                    } else {
                        coverImageData = e.target.result;
                        document.getElementById('coverPreview').innerHTML = `<div class="image-preview-item"><img src="${coverImageData}" alt="封面"><button type="button" class="image-preview-remove" onclick="removeCoverImage()"><i data-lucide="x" width="14" height="14"></i></button></div>`;
                        lucide.createIcons();
                    }
                };
                reader.readAsDataURL(file);
            });
        }

        function removeCoverImage() { coverImageData = null; document.getElementById('coverPreview').innerHTML = ''; }
        function removeGalleryImage(index) { galleryImageData.splice(index, 1); document.getElementById('galleryCount').textContent = galleryImageData.length; renderGalleryPreview(); }

        function renderGalleryPreview() {
            document.getElementById('galleryImagePreview').innerHTML = galleryImageData.map((img, i) => `<div class="image-preview-item"><img src="${img}" alt="图库 ${i + 1}"><button type="button" class="image-preview-remove" onclick="removeGalleryImage(${i})"><i data-lucide="x" width="14" height="14"></i></button></div>`).join('');
            lucide.createIcons();
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        document.getElementById('addWorkBtn').addEventListener('click', () => openWorkModal());
        document.getElementById('emptyAddBtn')?.addEventListener('click', () => openWorkModal());
        document.getElementById('modalClose').addEventListener('click', closeWorkModal);
        document.getElementById('cancelBtn').addEventListener('click', closeWorkModal);
        document.getElementById('saveBtn').addEventListener('click', () => {
            try {
                saveWork();
            } catch (err) {
                console.error('[Admin] Error saving work:', err);
                showToast('保存失败: ' + err.message, 'error');
            }
        });
        document.getElementById('deleteModalClose').addEventListener('click', closeDeleteModal);
        document.getElementById('cancelDeleteBtn').addEventListener('click', closeDeleteModal);
        document.getElementById('confirmDeleteBtn').addEventListener('click', () => {
            if (deleteWorkId) {
                const work = currentWorks.find(w => w.id === deleteWorkId);
                currentWorks = WorksData.deleteWork(deleteWorkId);
                WorksData.addLog('work_delete', `删除作品: ${work.title}`);
                WorksData.incrementCacheVersion();
                renderWorks(currentWorks);
                closeDeleteModal();
                showToast('作品已删除', 'success');
            }
        });

        searchInput.addEventListener('input', () => renderWorks(currentWorks));
        categoryFilter.addEventListener('change', () => renderWorks(currentWorks));

        worksGrid.addEventListener('click', (e) => {
            const editBtn = e.target.closest('.edit-btn');
            const deleteBtn = e.target.closest('.work-card-btn.delete');
            if (editBtn) { const id = parseInt(editBtn.dataset.id); openWorkModal(currentWorks.find(w => w.id === id)); }
            if (deleteBtn) { const id = parseInt(deleteBtn.dataset.id); openDeleteModal(id); }
        });

        setupImageUpload('coverUploadArea', 'coverInput', false);
        setupImageUpload('galleryUploadArea', 'galleryInput', true);
        renderWorks(currentWorks);
        updateBadge();

        // ========== 用户访问追踪 ==========
        (function() {
            const currentPage = 'admin-works.html';
            const userId = session?.username || 'admin';

            WorksData.startPageView(currentPage, userId);
            WorksData.recordVisit(currentPage, userId);

            let maxScroll = 0;
            window.addEventListener('scroll', function() {
                const scrollPercent = Math.round((window.scrollY / (document.body.scrollHeight - window.innerHeight)) * 100);
                if (scrollPercent > maxScroll) {
                    maxScroll = scrollPercent;
                    WorksData.updateScrollDepth(maxScroll);
                }
            });

            document.addEventListener('click', function() {
                WorksData.incrementInteractions();
            });

            window.addEventListener('beforeunload', function() {
                WorksData.endPageView();
            });

            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    WorksData.endPageView();
                } else {
                    WorksData.startPageView(currentPage, userId);
                }
            });
        })();

        console.log('[Admin] Page fully loaded');
        console.log('[Admin] Checking button bindings...');
        console.log('[Admin] addWorkBtn:', document.getElementById('addWorkBtn') ? 'found' : 'NOT FOUND');
        console.log('[Admin] saveBtn:', document.getElementById('saveBtn') ? 'found' : 'NOT FOUND');
        console.log('[Admin] WorksData:', typeof WorksData !== 'undefined' ? 'loaded' : 'NOT LOADED');
    </script>
</body>
</html>
