<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>张三 | 品牌与视觉设计师</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="hh/cloud-api.js?v=2026042305"></script>
    <script src="hh/data-manager.js?v=2026042305"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%231a1a1a' width='100' height='100' rx='12'/><text y='68' x='50' text-anchor='middle' fill='%23c9a87c' font-size='50' font-family='serif'>林</text></svg>">
    <style id="dynamicWorkTitleStyle"></style>
    <style>
        :root {
            --primary: #1a1a1a;
            --secondary: #666666;
            --accent: #c9a87c;
            --background: #fafafa;
            --surface: #ffffff;
            --muted: #e8e8e8;
            --font-heading: 'Cormorant Garamond', serif;
            --font-body: 'Inter', sans-serif;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
        }

        /* Dark Theme */
        [data-theme="dark"] {
            --primary: #f5f5f5;
            --secondary: #a0a0a0;
            --accent: #d4b896;
            --background: #121212;
            --surface: #1e1e1e;
            --muted: #2a2a2a;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-body);
            background-color: var(--background);
            color: var(--primary);
            line-height: 1.6;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        ::selection { background-color: var(--accent); color: var(--surface); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--background); }
        ::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--secondary); }

        /* Header */
        .header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            padding: 24px 48px; display: flex; justify-content: space-between; align-items: center;
            transition: all 0.3s ease;
        }
        .header.scrolled { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); box-shadow: 0 1px 0 var(--muted); }
        [data-theme="dark"] .header.scrolled { background: rgba(30, 30, 30, 0.95); }
        .logo { font-family: var(--font-heading); font-size: 24px; font-weight: 600; color: var(--primary); text-decoration: none; letter-spacing: 2px; }
        .nav { display: flex; gap: 48px; align-items: center; }
        .nav-link { font-size: 14px; font-weight: 500; color: var(--secondary); text-decoration: none; position: relative; transition: color 0.3s ease; }
        .nav-link::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 1px; background: var(--accent); transition: width 0.3s ease; }
        .nav-link:hover { color: var(--primary); }
        .nav-link:hover::after { width: 100%; }
        .mobile-menu-btn { display: none; background: none; border: none; cursor: pointer; color: var(--primary); }
        
        /* Theme Toggle */
        .theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            transition: all 0.3s ease;
            position: relative;
        }
        .theme-toggle:hover {
            background: var(--muted);
            transform: rotate(15deg);
        }
        .theme-toggle .icon-sun,
        .theme-toggle .icon-moon {
            position: absolute;
            transition: all 0.3s ease;
        }
        .theme-toggle .icon-sun { opacity: 1; transform: scale(1) rotate(0deg); }
        .theme-toggle .icon-moon { opacity: 0; transform: scale(0) rotate(-90deg); }
        
        [data-theme="dark"] .theme-toggle .icon-sun { opacity: 0; transform: scale(0) rotate(90deg); }
        [data-theme="dark"] .theme-toggle .icon-moon { opacity: 1; transform: scale(1) rotate(0deg); }

        /* Banner Slider */
        .banner-slider {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 24px;
        }
        .banner-slide {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover; background-position: center;
            z-index: 0;
        }
        .banner-slide::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.6) 100%);
        }
        .banner-content {
            position: relative; z-index: 1; max-width: 800px;
        }
        .banner-label { font-size: 12px; font-weight: 500; letter-spacing: 4px; text-transform: uppercase; color: var(--accent); margin-bottom: 24px; opacity: 0; animation: fadeInUp 0.8s ease forwards; }
        .banner-title { font-family: var(--font-heading); font-size: clamp(48px, 10vw, 96px); font-weight: 400; line-height: 1.1; margin-bottom: 24px; color: white; opacity: 0; animation: fadeInUp 0.8s ease 0.2s forwards; }
        .banner-subtitle { font-size: 18px; color: rgba(255,255,255,0.9); max-width: 500px; margin: 0 auto 48px; opacity: 0; animation: fadeInUp 0.8s ease 0.4s forwards; }
        .banner-cta { display: inline-flex; align-items: center; gap: 12px; padding: 16px 32px; background: var(--accent); color: var(--primary); font-size: 14px; font-weight: 500; text-decoration: none; border-radius: 2px; transition: all 0.3s ease; opacity: 0; animation: fadeInUp 0.8s ease 0.6s forwards; }
        .banner-cta:hover { background: white; transform: translateY(-2px); }
        .banner-dots { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; z-index: 10; }
        .banner-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.4); cursor: pointer; transition: all 0.3s ease; }
        .banner-dot.active { background: white; transform: scale(1.2); }
        .banner-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; background: rgba(255,255,255,0.2); border: none; border-radius: 50%; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; z-index: 10; }
        .banner-arrow:hover { background: var(--accent); color: var(--primary); }
        .banner-arrow.prev { left: 32px; }
        .banner-arrow.next { right: 32px; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(8px); } }

        /* Section Styles */
        .section { padding: 120px 48px; max-width: 1400px; margin: 0 auto; }
        .section-label { font-size: 12px; font-weight: 500; letter-spacing: 4px; text-transform: uppercase; color: var(--accent); margin-bottom: 16px; }
        .section-title { font-family: var(--font-heading); font-size: clamp(36px, 5vw, 56px); font-weight: 400; margin-bottom: 24px; }
        .section-desc { font-size: 16px; color: var(--secondary); max-width: 600px; }

        /* About Section */
        .about { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; }
        .about-image { position: relative; }
        .about-image img { width: 100%; aspect-ratio: 4/5; object-fit: cover; filter: grayscale(20%); }
        .about-image::before { content: ''; position: absolute; top: -20px; left: -20px; right: 20px; bottom: 20px; border: 1px solid var(--accent); z-index: -1; }
        .about-content { padding: 40px 0; }
        .about-text { margin-bottom: 32px; color: var(--secondary); line-height: 1.8; }
        .about-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; padding-top: 40px; border-top: 1px solid var(--muted); }
        .stat-item { text-align: center; }
        .stat-number { width: 183px; font-family: 'Inter', var(--font-body); font-size: 48px; font-weight: 700; color: var(--primary); line-height: 1; margin-bottom: 8px; }
        .stat-label { font-size: 14px; color: var(--secondary); }

        /* Works Section */
        .works-section { background: var(--background); }
        .works-header { text-align: center; margin-bottom: 64px; }
        .works-header .section-desc { margin: 0 auto; }
        .works-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
        .work-card { position: relative; cursor: pointer; overflow: hidden; background: var(--surface); border-radius: 12px; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); text-decoration: none; color: inherit; display: block; }
        .work-card:hover { transform: translateY(-8px); }
        .work-image { width: 100%; aspect-ratio: 16/10; overflow: hidden; border-radius: 12px 12px 0 0; position: relative; }
        .work-image img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .work-card:hover .work-image img { transform: scale(1.08); }
        .work-image::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.4) 100%); opacity: 0; transition: opacity 0.3s ease; }
        .work-card:hover .work-image::after { opacity: 1; }
        .work-info { padding: 24px; }
        .work-category { font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; font-weight: 500; }
        .work-title { font-family: var(--font-heading); font-size: 22px; font-weight: 500; margin-bottom: 10px; transition: all 0.3s ease; }
        .work-card:hover .work-title { color: var(--accent); }
        /* 动态样式将通过 JS 应用 */
        .work-desc { font-size: 14px; color: var(--secondary); line-height: 1.6; }
        .work-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 100%;
            background: rgba(192, 192, 192, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translateY(100%);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .work-card:hover .work-overlay { transform: translateY(0); }
        .work-overlay-text {
            color: #ffffff;
            font-size: 16px;
            font-weight: 500;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }
        .works-cta { text-align: center; margin-top: 64px; }
        .view-more-btn { display: inline-flex; align-items: center; gap: 12px; padding: 16px 32px; background: var(--primary); color: var(--surface); font-size: 14px; font-weight: 500; text-decoration: none; border-radius: 4px; transition: all 0.3s ease; }
        .view-more-btn:hover { background: var(--accent); color: var(--primary); transform: translateY(-2px); }
        
        /* Works Loading/Error/Empty States */
        .works-loading, .works-error, .works-empty {
            grid-column: 1 / -1;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 80px 24px; color: var(--secondary); text-align: center; gap: 16px;
        }
        .works-loading p, .works-error p, .works-empty p { font-size: 16px; margin: 0; }
        .works-empty i, .works-error i { color: var(--muted); }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-spinner {
            width: 40px; height: 40px; border: 3px solid var(--muted);
            border-top-color: var(--accent); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .retry-btn, .add-work-btn {
            margin-top: 8px; padding: 12px 24px; background: var(--primary);
            color: var(--surface); font-size: 14px; font-weight: 500;
            border: none; border-radius: 4px; cursor: pointer; text-decoration: none;
            transition: all 0.3s ease;
        }
        .retry-btn:hover, .add-work-btn:hover { background: var(--accent); color: var(--primary); }

        /* Contact Section */
        .contact { background: var(--primary); color: var(--surface); max-width: none; }
        .contact .section-label { color: var(--accent); }
        .contact .section-title { color: var(--surface); }
        .contact .section-desc { color: rgba(255, 255, 255, 0.7); }
        .contact-wrapper { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 80px; padding: 120px 48px; }
        .contact-form { display: flex; flex-direction: column; gap: 24px; }
        .form-group { position: relative; }
        .form-input { width: 100%; padding: 16px 0; font-family: var(--font-body); font-size: 16px; background: transparent; border: none; border-bottom: 1px solid rgba(255, 255, 255, 0.3); color: var(--surface); outline: none; transition: border-color 0.3s ease; }
        .form-input::placeholder { color: rgba(255, 255, 255, 0.5); }
        .form-input:focus { border-color: var(--accent); }
        .form-textarea { resize: none; min-height: 120px; }
        .form-submit { align-self: flex-start; padding: 16px 40px; background: var(--accent); color: var(--primary); font-family: var(--font-body); font-size: 14px; font-weight: 500; border: none; cursor: pointer; transition: all 0.3s ease; margin-top: 16px; }
        .form-submit:hover { background: var(--surface); transform: translateY(-2px); }
        .contact-info { display: flex; flex-direction: column; justify-content: center; }
        .contact-item { margin-bottom: 32px; }
        .contact-label { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
        .contact-value { font-family: var(--font-heading); font-size: 24px; }
        .contact-value a { color: var(--surface); text-decoration: none; transition: color 0.3s ease; }
        .contact-value a:hover { color: var(--accent); }
        .social-links { display: flex; gap: 24px; margin-top: 48px; }
        .social-link { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255, 255, 255, 0.3); color: var(--surface); text-decoration: none; transition: all 0.3s ease; }
        .social-link:hover { background: var(--accent); border-color: var(--accent); color: var(--primary); }

        /* Footer */
        .footer { padding: 32px 48px; text-align: center; font-size: 14px; color: var(--secondary); background: var(--background); }

        /* Mobile Menu */
        .mobile-menu { position: fixed; top: 0; right: -100%; width: 280px; height: 100vh; background: var(--surface); z-index: 1500; padding: 80px 32px; transition: right 0.3s ease; }
        .mobile-menu.active { right: 0; }
        .mobile-menu-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); z-index: 1400; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .mobile-menu-overlay.active { opacity: 1; visibility: visible; }
        .mobile-nav { display: flex; flex-direction: column; gap: 32px; }
        .mobile-nav-link { font-size: 18px; color: var(--primary); text-decoration: none; transition: color 0.3s ease; }
        .mobile-nav-link:hover { color: var(--accent); }

        /* Scroll Animations */
        .reveal { opacity: 0; transform: translateY(40px); transition: all 0.8s ease; }
        .reveal.active { opacity: 1; transform: translateY(0); }

        /* Responsive */
        @media (max-width: 1200px) { .works-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) {
            .header { padding: 16px 24px; }
            .nav { display: none; }
            .mobile-menu-btn { display: block; }
            .section { padding: 80px 24px; }
            .about { grid-template-columns: 1fr; gap: 48px; }
            .about-image::before { display: none; }
            .about-stats { grid-template-columns: repeat(3, 1fr); gap: 16px; }
            .stat-number { font-size: 36px; }
            .works-grid { grid-template-columns: 1fr; }
            .contact-wrapper { grid-template-columns: 1fr; gap: 48px; padding: 80px 24px; }
            .footer { padding: 24px; }
            .banner-arrow { display: none; }
            .theme-toggle { width: 36px; height: 36px; }
            .banner-slider { min-height: 100vh; padding: 80px 16px 60px; }
            .banner-slide { background-size: 100% 100%; background-position: center center; }
            .banner-content { padding: 0 8px; }
            .banner-label { font-size: 10px; letter-spacing: 2px; margin-bottom: 16px; }
            .banner-title { font-size: clamp(36px, 12vw, 48px); margin-bottom: 16px; }
            .banner-subtitle { font-size: 14px; margin-bottom: 32px; padding: 0 16px; }
            .banner-cta { padding: 12px 24px; font-size: 13px; }
            .banner-dots { bottom: 40px; gap: 8px; }
            .banner-dot { width: 8px; height: 8px; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header" id="header">
        <a href="#" class="logo" id="headerLogo">张三</a>
        <nav class="nav">
            <a href="#about" class="nav-link">关于</a>
            <a href="#works" class="nav-link">作品</a>
            <a href="resume.html" class="nav-link">个人简历</a>
        </nav>
        <div class="header-actions">
            <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
                <i data-lucide="sun" class="icon-sun" width="20" height="20"></i>
                <i data-lucide="moon" class="icon-moon" width="20" height="20"></i>
            </button>
            <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="菜单">
            <i data-lucide="menu" width="24" height="24"></i>
        </button>
    </header>

    <!-- Mobile Menu -->
    <div class="mobile-menu-overlay" id="mobileMenuOverlay"></div>
    <div class="mobile-menu" id="mobileMenu">
        <nav class="mobile-nav">
            <a href="#about" class="mobile-nav-link">关于</a>
            <a href="#works" class="mobile-nav-link">作品</a>
            <a href="resume.html" class="mobile-nav-link">个人简历</a>
        </nav>
    </div>

    <!-- Banner Slider -->
    <section class="banner-slider" id="bannerSlider">
        <!-- Slides will be rendered dynamically -->
        <button class="banner-arrow prev" id="bannerPrev"><i data-lucide="chevron-left" width="24" height="24"></i></button>
        <button class="banner-arrow next" id="bannerNext"><i data-lucide="chevron-right" width="24" height="24"></i></button>
        <div class="banner-dots" id="bannerDots"></div>
    </section>

    <!-- About -->
    <section class="section" id="about">
        <div class="about reveal">
            <div class="about-image">
                <img src="" alt="" id="aboutAvatar">
            </div>
            <div class="about-content" id="aboutContent">
                <!-- Content will be rendered dynamically -->
            </div>
        </div>
    </section>

    <!-- Works Section -->
    <section class="section works-section" id="works">
        <div class="works-header reveal">
            <span class="section-label">精选作品</span>
            <h2 class="section-title">Recent Works</h2>
        </div>
        <div class="works-grid" id="worksGrid">
            <!-- Works will be rendered dynamically -->
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 <span id="footerName">张三</span>设计工作室. All rights reserved.</p>
    </footer>

    <script>
        // ===== 初始化云端同步 =====
        async function initializeApp() {
            if (typeof WorksData !== 'undefined' && WorksData.init) {
                await WorksData.init();
                console.log('[Index] Cloud sync initialized');
            }
        }

        // ===== 从云端刷新所有数据并重新渲染页面 =====
        async function refreshData() {
            console.log('[Index] Refreshing data from cloud...');
            try {
                if (typeof WorksData !== 'undefined' && WorksData.refreshAllData) {
                    await WorksData.refreshAllData();
                }
                // 重新渲染所有区域
                renderBanners();
                renderAbout();
                renderWorks();
                applyWorkTitleStyle();
                console.log('[Index] Data refreshed and re-rendered');
            } catch (e) {
                console.error('[Index] Error refreshing data:', e);
            }
        }
        
        // ===== Banner Data =====
        let banners = [];
        let currentBanner = 0;
        let bannerInterval;
        let dotsContainer;

        // ===== Banner Slider =====
        function renderBanners() {
            try {
                if (typeof WorksData === 'undefined') {
                    throw new Error('WorksData not loaded');
                }
                banners = WorksData.getBannersForDisplay();
            } catch (e) {
                console.warn('[Index] Using default banners:', e.message);
                banners = [{ title: '张三设计工作室', subtitle: '用设计讲述品牌故事', image: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1920&h=1080&fit=crop', link: '' }];
            }
            
            const slider = document.getElementById('bannerSlider');
            if (!slider) return;
            
            // Render slides
            slider.innerHTML = `
                ${banners.map((banner, i) => `
                    <div class="banner-slide" style="background-image: url('${banner.image}'); opacity: ${i === 0 ? 1 : 0}; transition: opacity 0.8s ease;">
                        <div class="banner-slide" style="background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.6) 100%);"></div>
                    </div>
                `).join('')}
                <div class="banner-content" id="bannerContent">
                    <p class="banner-label">${banners[0]?.subtitle || ''}</p>
                    <h1 class="banner-title">${banners[0]?.title || ''}</h1>
                    <a href="${banners[0]?.link || '#works'}" class="banner-cta">
                        <span>探索作品</span>
                        <i data-lucide="arrow-right" width="18" height="18"></i>
                    </a>
                </div>
                <button class="banner-arrow prev" id="bannerPrev"><i data-lucide="chevron-left" width="24" height="24"></i></button>
                <button class="banner-arrow next" id="bannerNext"><i data-lucide="chevron-right" width="24" height="24"></i></button>
                <div class="banner-dots" id="bannerDots"></div>
            `;
            
            // Render dots
            dotsContainer = document.getElementById('bannerDots');
            dotsContainer.innerHTML = banners.map((_, i) => `<span class="banner-dot ${i === 0 ? 'active' : ''}" data-index="${i}"></span>`).join('');
            
            // Bind arrow events
            const prevBtn = document.getElementById('bannerPrev');
            const nextBtn = document.getElementById('bannerNext');
            if (prevBtn) prevBtn.addEventListener('click', () => changeBanner(-1));
            if (nextBtn) nextBtn.addEventListener('click', () => changeBanner(1));
            
            // Bind dots
            document.querySelectorAll('.banner-dot').forEach(dot => {
                dot.addEventListener('click', () => goToBanner(parseInt(dot.dataset.index)));
            });
            
            lucide.createIcons();
            startBannerAutoPlay();
        }

        function changeBanner(delta) {
            currentBanner = (currentBanner + delta + banners.length) % banners.length;
            updateBannerSlide();
        }

        function goToBanner(index) {
            currentBanner = index;
            updateBannerSlide();
        }

        function updateBannerSlide() {
            const slides = document.querySelectorAll('.banner-slide');
            const dots = document.querySelectorAll('.banner-dot');
            
            slides.forEach((slide, i) => slide.style.opacity = i === currentBanner ? 1 : 0);
            dots.forEach((dot, i) => dot.classList.toggle('active', i === currentBanner));
            
            const banner = banners[currentBanner];
            const content = document.getElementById('bannerContent');
            if (content) {
                content.innerHTML = `
                    <p class="banner-label">${banner?.subtitle || ''}</p>
                    <h1 class="banner-title">${banner?.title || ''}</h1>
                    <a href="${banner?.link || '#works'}" class="banner-cta">
                        <span>探索作品</span>
                        <i data-lucide="arrow-right" width="18" height="18"></i>
                    </a>
                `;
                lucide.createIcons();
            }
        }

        function startBannerAutoPlay() {
            clearInterval(bannerInterval);
            if (banners.length > 1) {
                bannerInterval = setInterval(() => changeBanner(1), 5000);
            }
        }

        // ===== About Section =====
        function renderAbout() {
            try {
                if (typeof WorksData === 'undefined') {
                    throw new Error('WorksData not loaded');
                }
                const about = WorksData.getAboutForDisplay();
                
                const headerLogo = document.getElementById('headerLogo');
                const footerName = document.getElementById('footerName');
                const aboutAvatar = document.getElementById('aboutAvatar');
                const aboutContent = document.getElementById('aboutContent');
                
                if (headerLogo) headerLogo.textContent = about.name || '张三';
                if (footerName) footerName.textContent = about.name || '张三';
                document.title = `${about.name || '张三'} | 品牌与视觉设计师`;
                
                if (aboutAvatar) {
                    aboutAvatar.src = about.avatar || 'https://api.dicebear.com/7.x/avataaars/svg?seed=ZhangSan';
                    aboutAvatar.alt = about.name || '张三';
                }
                
                if (aboutContent) {
                    aboutContent.innerHTML = `
                        <span class="section-label">关于我</span>
                        <h2 class="section-title">${about.name || '张三'}</h2>
                        <p class="about-text">${about.bio || ''}</p>
                        <div class="about-stats">
                            <div class="stat-item">
                                <div class="stat-number">${about.experience || '8年'}</div>
                                <div class="stat-label">年设计经验</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number">${about.projects || '200+'}</div>
                                <div class="stat-label">完成项目</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number">${about.clients || '50+'}</div>
                                <div class="stat-label">合作品牌</div>
                            </div>
                        </div>
                    `;
                }
                
                // Update contact info (仅当元素存在时)
                const contactInfoEl = document.getElementById('contactInfo');
                if (contactInfoEl) {
                    contactInfoEl.innerHTML = `
                        ${about.email ? `
                        <div class="contact-item">
                            <p class="contact-label">邮箱</p>
                            <p class="contact-value"><a href="mailto:${about.email}">${about.email}</a></p>
                        </div>
                        ` : ''}
                        ${about.phone ? `
                        <div class="contact-item">
                            <p class="contact-label">电话</p>
                            <p class="contact-value"><a href="tel:${about.phone.replace(/-/g, '')}">${about.phone}</a></p>
                        </div>
                        ` : ''}
                        ${about.location ? `
                        <div class="contact-item">
                            <p class="contact-label">地址</p>
                            <p class="contact-value">${about.location}</p>
                        </div>
                        ` : ''}
                        <div class="social-links">
                            ${about.social?.wechat ? `<a href="#" class="social-link" aria-label="微信"><i data-lucide="message-circle" width="20" height="20"></i></a>` : ''}
                            ${about.social?.dribbble ? `<a href="https://dribbble.com/${about.social.dribbble}" class="social-link" aria-label="Dribbble"><i data-lucide="dribbble" width="20" height="20"></i></a>` : ''}
                            <a href="#" class="social-link" aria-label="Instagram"><i data-lucide="instagram" width="20" height="20"></i></a>
                        </div>
                    `;
                }
                lucide.createIcons();
            } catch (e) {
                console.error('[Index] Error rendering about:', e);
            }
        }

        // ===== Works Section =====
        function renderWorks() {
            const worksGrid = document.getElementById('worksGrid');
            if (!worksGrid) return;
            
            // 显示加载状态
            worksGrid.innerHTML = `
                <div class="works-loading">
                    <div class="loading-spinner"></div>
                    <p>正在加载作品...</p>
                </div>
            `;
            
            try {
                if (typeof WorksData === 'undefined') {
                    throw new Error('WorksData not loaded');
                }
                
                const works = WorksData.getWorksForDisplay().slice(0, 9);
                
                if (works.length === 0) {
                    worksGrid.innerHTML = `
                        <div class="works-empty">
                            <i data-lucide="image-off" width="48" height="48"></i>
                            <p>暂无作品</p>
                            <a href="admin-works.html" class="add-work-btn">添加作品</a>
                        </div>
                    `;
                    lucide.createIcons();
                    return;
                }
                
                worksGrid.innerHTML = works.map(work => {
                    const imageUrl = work.image || work.mainImage || '';
                    const fallbackImage = 'https://images.unsplash.com/photo-1558591710-4b4a1ae0f04d?w=800&h=500&fit=crop';
                    return `
                    <a href="work.html?id=${work.id}" class="work-card reveal">
                        <div class="work-image">
                            <img src="${imageUrl}" alt="${work.title}" onerror="this.src='${fallbackImage}'" loading="lazy">
                        </div>
                        <div class="work-info">
                            <span class="work-category">${work.category || '品牌设计'}</span>
                            <h3 class="work-title">${work.title}</h3>
                            <p class="work-desc">${work.desc || ''}</p>
                        </div>
                        <div class="work-overlay">
                            <span class="work-overlay-text">查看作品详情页 ></span>
                        </div>
                    </a>
                `}).join('');
                
                lucide.createIcons();
                revealOnScroll();
            } catch (e) {
                console.error('[Index] Error rendering works:', e);
                worksGrid.innerHTML = `
                    <div class="works-error">
                        <i data-lucide="alert-circle" width="48" height="48"></i>
                        <p>加载失败，请刷新重试</p>
                        <button onclick="retryRenderWorks()" class="retry-btn">重试</button>
                    </div>
                `;
                lucide.createIcons();
            }
        }
        
        // 重试加载作品
        function retryRenderWorks() {
            renderWorks();
        }

        // ===== Real-time Sync =====
        function handleDataSync(e) {
            console.log('[Index] Data sync received:', e.detail?.type);
            // 立即刷新所有数据
            setTimeout(refreshData, 0);
        }

        // 监听云端同步完成事件
        window.addEventListener('cloudSyncCompleted', function(e) {
            console.log('[Index] Cloud sync completed, refreshing data...');
            setTimeout(refreshData, 0);
        });

        window.addEventListener('siteDataSync', handleDataSync);
        window.addEventListener('worksDataUpdated', handleDataSync);

        window.addEventListener('storage', function(e) {
            if (e.key === 'portfolio_sync' || e.key === 'portfolio_banners' || e.key === 'portfolio_about' || e.key === 'portfolio_works' || e.key === 'portfolio_cache_version') {
                console.log('[Index] Storage changed:', e.key);
                setTimeout(refreshData, 0);
            }
        });

        // ===== Header Scroll =====
        const header = document.getElementById('header');
        if (header) {
            window.addEventListener('scroll', () => {
                header.classList.toggle('scrolled', window.scrollY > 100);
            });
        }

        // ===== Mobile Menu =====
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        const mobileMenuOverlay = document.getElementById('mobileMenuOverlay');

        if (mobileMenuBtn && mobileMenu && mobileMenuOverlay) {
            mobileMenuBtn.addEventListener('click', () => {
                mobileMenu.classList.toggle('active');
                mobileMenuOverlay.classList.toggle('active');
            });
            mobileMenuOverlay.addEventListener('click', () => {
                mobileMenu.classList.remove('active');
                mobileMenuOverlay.classList.remove('active');
            });
            document.querySelectorAll('.mobile-nav-link').forEach(link => {
                link.addEventListener('click', () => {
                    mobileMenu.classList.remove('active');
                    mobileMenuOverlay.classList.remove('active');
                });
            });
        }

        // ===== Scroll Reveal =====
        function revealOnScroll() {
            const revealElements = document.querySelectorAll('.reveal');
            revealElements.forEach(el => {
                if (el.getBoundingClientRect().top < window.innerHeight - 100) {
                    el.classList.add('active');
                }
            });
        }
        window.addEventListener('scroll', revealOnScroll);

        // ===== Theme Toggle =====
        const THEME_KEY = 'portfolio_theme';

        function getSavedTheme() {
            return localStorage.getItem(THEME_KEY);
        }

        function setTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
            localStorage.setItem(THEME_KEY, theme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            setTheme(newTheme);
        }

        // Initialize theme
        function initTheme() {
            const savedTheme = getSavedTheme();
            if (savedTheme) {
                setTheme(savedTheme);
            } else {
                // Check system preference
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (prefersDark) {
                    setTheme('dark');
                }
            }
        }

        // Theme toggle button
        const themeToggle = document.getElementById('themeToggle');
        if (themeToggle) {
            themeToggle.addEventListener('click', toggleTheme);
        }

        // Listen for system theme changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            if (!getSavedTheme()) {
                setTheme(e.matches ? 'dark' : 'light');
            }
        });

        // ===== Contact Form =====
        const contactForm = document.getElementById('contactForm');
        if (contactForm) {
            contactForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('name').value.trim();
                const email = document.getElementById('email').value.trim();
                const message = document.getElementById('message').value.trim();
                if (name && email && message) {
                    WorksData.addContact({ name, email, message });
                    WorksData.addLog('contact', `新留言: ${name}`);
                    alert(`感谢您的留言，${name}！我会尽快与您联系。`);
                    e.target.reset();
                }
            });
        }

        // ===== Smooth Scroll =====
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
        });

        // ===== Initialize =====
        function initPage() {
            initTheme();
            applyWorkTitleStyle();
            lucide.createIcons();
            
            // 只渲染一次
            renderBanners();
            renderAbout();
            renderWorks();
            revealOnScroll();
        }

        // 应用作品标题样式
        function applyWorkTitleStyle() {
            try {
                if (typeof WorksData === 'undefined') return;
                const settings = WorksData.getStyleSettingsForDisplay();
                const titleStyle = settings?.workTitle;
                if (!titleStyle) return;

                const styleEl = document.getElementById('dynamicWorkTitleStyle');
                if (styleEl) {
                    styleEl.textContent = `
                        .work-title {
                            font-family: ${titleStyle.fontFamily} !important;
                            font-size: ${titleStyle.fontSize} !important;
                            font-weight: ${titleStyle.fontWeight} !important;
                            color: ${titleStyle.color} !important;
                        }
                    `;
                }
            } catch (e) {
                console.warn('[Index] Error applying work title style:', e);
            }
        }
        
        // 等待 DOM 加载完成再初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', async () => {
                await initializeApp();
                initPage();
            });
        } else {
            (async () => {
                await initializeApp();
                initPage();
            })();
        }
    </script>
</body>
</html>
