<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品详情 | 张三设计工作室</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/hh/cloud-api.js?v=2026042304"></script>
    <script src="/hh/data-manager.js?v=2026042304"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%231a1a1a' width='100' height='100' rx='12'/><text y='68' x='50' text-anchor='middle' fill='%23c9a87c' font-size='50' font-family='serif'>林</text></svg>">
    <style>
        :root {
            --primary: #1a1a1a;
            --secondary: #666666;
            --accent: #c9a87c;
            --background: #fafafa;
            --surface: #ffffff;
            --muted: #e8e8e8;
            --font-heading: 'Cormorant Garamond', serif;
            --font-body: 'Inter', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background-color: var(--background);
            color: var(--primary);
            line-height: 1.6;
            max-width: 100%;
        }

        body::before {
            content: '';
            display: block;
            height: 80px;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 24px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--muted);
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--secondary);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .back-btn:hover { color: var(--accent); }

        .logo {
            font-family: var(--font-heading);
            font-size: 24px;
            font-weight: 600;
            color: var(--primary);
            text-decoration: none;
            letter-spacing: 2px;
        }

        /* Hero Header - Cover Image Background */
        .work-hero {
            position: relative;
            height: 70vh;
            min-height: 500px;
            max-height: 800px;
            display: flex;
            align-items: flex-end;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .work-hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.85) 100%);
            z-index: 1;
        }

        .work-hero-content {
            position: relative;
            z-index: 2;
            max-width: 1440px;
            margin: 0 auto;
            padding: 60px 48px;
            text-align: left;
        }

        /* Container - Responsive max-width with margins */
        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 48px;
        }

        /* Work Info - Top Section */
        .work-info {
            max-width: 1440px;
            margin: 0 auto;
            padding: 80px 48px 60px;
        }

        .work-header {
            margin-bottom: 48px;
        }

        .work-meta {
            display: flex;
            gap: 24px;
            margin-bottom: 16px;
            align-items: center;
        }

        .work-category {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .work-year {
            font-size: 12px;
            color: var(--secondary);
        }

        .work-title {
            font-family: var(--font-heading);
            font-size: clamp(36px, 5vw, 56px);
            font-weight: 400;
            margin-bottom: 16px;
        }

        .work-desc {
            font-size: 16px;
            color: var(--secondary);
            max-width: 700px;
            line-height: 1.8;
        }

        /* Info Cards */
        .info-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            margin-top: 48px;
        }

        .info-card {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 24px;
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid var(--muted);
        }

        .info-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(201, 168, 124, 0.1);
            border-radius: 10px;
            color: var(--accent);
            flex-shrink: 0;
        }

        .info-content {
            flex: 1;
        }

        .info-label {
            font-size: 12px;
            color: var(--secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .info-value {
            font-family: var(--font-heading);
            font-size: 18px;
            color: var(--primary);
        }

        /* Images - 1440px centered container */
        .work-images {
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 48px 120px;
        }

        .work-image-item {
            width: 100%;
            max-width: 1440px;
            margin-bottom: 0;
            background: var(--muted);
        }

        .work-image-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Loading */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 16px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--muted);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 14px;
            color: var(--secondary);
        }

        /* 404 */
        .not-found {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 48px;
        }

        .not-found h1 {
            font-family: var(--font-heading);
            font-size: 120px;
            color: var(--muted);
            margin-bottom: 16px;
        }

        .not-found p {
            font-size: 18px;
            color: var(--secondary);
            margin-bottom: 32px;
        }

        .not-found a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 4px;
            transition: background 0.3s ease;
        }

        .not-found a:hover {
            background: var(--accent);
        }

        /* More Works Section */
        .more-works {
            padding: 80px 48px 120px;
            border-top: 1px solid var(--muted);
        }

        .more-works-header {
            text-align: center;
            margin-bottom: 48px;
        }

        .more-works-title {
            font-family: var(--font-heading);
            font-size: clamp(28px, 4vw, 40px);
            font-weight: 400;
        }

        /* More Works Grid */
        .more-works-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 32px;
            margin-top: 48px;
        }

        .more-work-card {
            display: block;
            text-decoration: none;
            color: inherit;
            border-radius: 12px;
            overflow: hidden;
            background: var(--surface);
            transition: transform 0.3s ease;
        }

        .more-work-card:hover {
            transform: translateY(-4px);
        }

        .more-work-image {
            aspect-ratio: 16/10;
            overflow: hidden;
        }

        .more-work-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .more-work-card:hover .more-work-image img {
            transform: scale(1.05);
        }

        .more-work-info {
            padding: 20px;
        }

        .more-work-category {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .more-work-title {
            font-family: var(--font-heading);
            font-size: 20px;
            margin-bottom: 4px;
        }

        .more-work-desc {
            font-size: 13px;
            color: var(--secondary);
        }

        /* Responsive - Tablet */
        @media (max-width: 1440px) {
            .work-hero-content,
            .work-info,
            .work-images,
            .more-works {
                padding-left: calc((100vw - 1440px) / 2 + 48px);
                padding-right: calc((100vw - 1440px) / 2 + 48px);
            }
        }

        @media (max-width: 1024px) {
            .work-hero-content,
            .work-info,
            .work-images,
            .more-works {
                padding-left: 32px;
                padding-right: 32px;
            }
            .info-cards {
                grid-template-columns: repeat(2, 1fr);
            }
            .more-works-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Responsive - Mobile */
        @media (max-width: 768px) {
            .header { padding: 16px 20px; }
            .work-hero-content,
            .work-info,
            .more-works {
                padding-left: 20px;
                padding-right: 20px;
            }
            .work-images {
                padding-left: 20px;
                padding-right: 20px;
            }
            .info-cards {
                grid-template-columns: 1fr;
                gap: 16px;
                margin-top: 32px;
            }
            .info-card { padding: 16px; }
            .more-works-grid {
                grid-template-columns: 1fr;
                gap: 20px;
                margin-top: 32px;
            }
            .work-header { margin-bottom: 32px; }
            .more-works-header { margin-bottom: 32px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="back-btn">
            <i data-lucide="arrow-left" width="20" height="20"></i>
            <span>返回首页</span>
        </a>
        <a href="index.html" class="logo">张三</a>
        <div style="width: 100px;"></div>
    </header>

    <main id="app">
        <div class="loading">
            <div class="loading-spinner"></div>
            <p class="loading-text">加载中...</p>
        </div>
    </main>

    <script>
        lucide.createIcons();

        function getWorkId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        function renderWork(work) {
            const app = document.getElementById('app');
            
            // Update page title
            document.title = `${work.title} | 张三设计工作室`;

            // Get cover image for hero background
            const coverImage = work.mainImage || work.image || '';

            // Build gallery images only (exclude cover from content)
            const galleryImages = [];
            if (work.gallery && work.gallery.length > 0) {
                galleryImages.push(...work.gallery);
            }

            // Generate images HTML
            const imagesHtml = galleryImages.map(img => `
                <div class="work-image-item">
                    <img src="${img}" alt="作品图片">
                </div>
            `).join('');

            // Get other works (excluding current work)
            const allWorks = WorksData.getWorks();
            const relatedWorks = allWorks.filter(w => w.id !== work.id).slice(0, 3);

            app.innerHTML = `
                <!-- Hero Header - Cover Image Background -->
                <div class="work-hero" style="background-image: url('${coverImage}');">
                </div>

                <!-- Work Info Section -->
                <section class="work-info">
                    <div class="work-header">
                        <div class="work-meta">
                            <span class="work-category">${work.category || '品牌设计'}</span>
                            ${work.year ? `<span class="work-year">${work.year}年</span>` : ''}
                        </div>
                        <h1 class="work-title">${work.title}</h1>
                        ${work.desc ? `<p class="work-desc">${work.desc}</p>` : ''}
                    </div>

                    <!-- Info Cards with Icons -->
                    <div class="info-cards">
                        <div class="info-card">
                            <div class="info-icon">
                                <i data-lucide="tag" width="24" height="24"></i>
                            </div>
                            <div class="info-content">
                                <p class="info-label">作品类型</p>
                                <p class="info-value">${work.category || '品牌设计'}</p>
                            </div>
                        </div>
                        <div class="info-card">
                            <div class="info-icon">
                                <i data-lucide="calendar" width="24" height="24"></i>
                            </div>
                            <div class="info-content">
                                <p class="info-label">完成年份</p>
                                <p class="info-value">${work.year || '-'}</p>
                            </div>
                        </div>
                        <div class="info-card">
                            <div class="info-icon">
                                <i data-lucide="clock" width="24" height="24"></i>
                            </div>
                            <div class="info-content">
                                <p class="info-label">项目周期</p>
                                <p class="info-value">${work.duration || '-'}</p>
                            </div>
                        </div>
                        <div class="info-card">
                            <div class="info-icon">
                                <i data-lucide="image" width="24" height="24"></i>
                            </div>
                            <div class="info-content">
                                <p class="info-label">图片数量</p>
                                <p class="info-value">${galleryImages.length} 张</p>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Images - Seamless Vertical Stack -->
                <section class="work-images">
                    ${imagesHtml}
                </section>

                <!-- More Works Section -->
                <section class="more-works">
                    <div class="more-works-header">
                        <h2 class="more-works-title">更多作品</h2>
                    </div>
                    <div class="more-works-grid">
                        ${renderMoreWorksCards(relatedWorks)}
                    </div>
                </section>
            `;

            lucide.createIcons();
        }

        function renderMoreWorksCards(works) {
            if (works.length === 0) {
                return '<p style="text-align:center;color:#666;grid-column:1/-1;padding:40px;">暂无其他作品</p>';
            }
            return works.map(work => `
                <a href="work.html?id=${work.id}" class="more-work-card">
                    <div class="more-work-image">
                        <img src="${work.mainImage || work.image}" alt="${work.title}">
                    </div>
                    <div class="more-work-info">
                        <p class="more-work-category">${work.category || '品牌设计'}</p>
                        <h3 class="more-work-title">${work.title}</h3>
                        <p class="more-work-desc">${work.desc || ''}</p>
                    </div>
                </a>
            `).join('');
        }

        function renderNotFound() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="not-found">
                    <h1>404</h1>
                    <p>抱歉，找不到该作品</p>
                    <a href="index.html">
                        <i data-lucide="arrow-left" width="18" height="18"></i>
                        返回首页
                    </a>
                </div>
            `;
            lucide.createIcons();
        }

        // 初始化云端同步
        async function initializeApp() {
            if (typeof WorksData !== 'undefined' && WorksData.init) {
                await WorksData.init();
                console.log('[Work] Cloud sync initialized');
            }
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('[Work] Page loaded');
            
            // 先初始化云端同步
            await initializeApp();
            
            const workId = getWorkId();
            console.log('[Work] ID:', workId);

            if (!workId) {
                console.log('[Work] No ID, redirecting...');
                renderNotFound();
                return;
            }

            // Get work data
            const works = WorksData.getWorks();
            console.log('[Work] All works:', works.length);
            
            const work = works.find(w => w.id == workId);
            console.log('[Work] Found:', work);

            if (work) {
                renderWork(work);
            } else {
                renderNotFound();
            }
        });
    </script>
</body>
</html>
